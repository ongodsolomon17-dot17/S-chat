<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats — S-Chat</title>
    <link rel="stylesheet" href="css/S-Chat-Style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
</head>
<body>

    <div class="titleandprofile">
        <img src="images/MY S.png" alt="S-Tech logo" width="80" height="75" class="profilepicture">
        <div class="online-indicator"></div>
        <h1 class="h1-title">Chats</h1>
    </div>

    <div class="chat-home-searchbar">
        <form onsubmit="return false;">
            <input type="text" placeholder="Search chats..." class="chat-home-searchinput" name="home-chat-searchinput">
            <button type="submit" name="home-chat-search-icon" class="home-chat-search-icon" aria-label="Search">
                <img src="my icons/search-magnifire-icon.png" alt="" width="20" height="20">
            </button>
        </form>
    </div>

    <div id="chat-list" class="chat-thread">
        <!-- Populated by js/chats.js once the messaging API is live -->
    </div>

    <div class="pages-btn-container">
        <nav><a href="S-chat-home.html"><button class="primary-btn"><img src="my icons/chats.png" alt="" width="20" height="20">Chats</button></a></nav>
        <nav><a href="S-chat-status.html"><button class="primary-btn">Status</button></a></nav>
        <nav><a href="S-chat-calls.html"><button class="primary-btn">Calls</button></a></nav>
        <nav><a href="S-chat-settings.html"><button class="primary-btn">Settings</button></a></nav>
    </div>

    <script src="js/nav.js" defer></script>
</body>
</html>
