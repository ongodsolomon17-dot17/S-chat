<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — S-Chat</title>
    <link rel="stylesheet" href="css/S-Chat-Style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
</head>
<body>

    <div class="signupvideopng">
        <video src="images/s-tech-ai-orb.mp4" width="140" height="140" autoplay loop muted playsinline id="signupvideo"></video>
    </div>

    <div id="auth-alert" class="auth-alert" role="alert"></div>

    <div class="signup-box">
        <form id="signup-form" novalidate>
            <fieldset class="custom-size">
                <legend class="signuptextlabels">Create your account</legend>

                <label for="signup-username" class="signuptextlabels">Username</label>
                <input type="text" id="signup-username" name="signup-username" class="signupinputs"
                    placeholder="3-24 characters, letters/numbers" minlength="3" maxlength="24"
                    autocomplete="username" autofocus required>

                <label for="signup-email" class="signuptextlabels">Email</label>
                <input type="email" id="signup-email" name="signup-email" class="signupinputs"
                    placeholder="you@example.com" autocomplete="email" required>

                <label for="signup-password" class="signuptextlabels">Password</label>
                <input type="password" id="signup-password" name="signup-password" class="signupinputs"
                    placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>

                <div class="signup-submit-btn-container">
                    <button type="submit" class="signup-submit-btn" id="signup-submit-btn">Create Account</button>
                </div>
            </fieldset>
        </form>

        <div class="login-link">
            Already have an account? <a href="S-chat-log-in.html" style="color:var(--s-accent-cyan)">Log in</a>
        </div>
    </div>

    <script src="js/auth.js" defer></script>
</body>
</html>
