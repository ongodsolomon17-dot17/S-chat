<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status — S-Chat</title>
    <link rel="stylesheet" href="css/S-Chat-Style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <style>
        .status-wrap { max-width: 560px; margin: 0 auto 130px; padding: 0 16px; }
        .my-status-row {
            display: flex; align-items: center; gap: 14px; padding: 14px; cursor: pointer;
            background: var(--s-panel); border: 1px solid var(--s-panel-border); border-radius: 16px; margin-bottom: 18px;
        }
        .my-status-row .avatar-wrap { position: relative; }
        .my-status-row img.avatar { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.06); }
        .my-status-row .avatar-wrap.has-status img.avatar { border: 2px solid var(--s-accent-cyan); padding: 2px; }
        .add-badge {
            position: absolute; bottom: -2px; right: -2px; width: 22px; height: 22px; border-radius: 50%;
            background: var(--s-accent-cyan); color: #01192d; font-weight: 900; font-size: 15px;
            display: flex; align-items: center; justify-content: center; border: 2px solid var(--s-bg-deep); cursor: pointer;
        }
        .my-status-row .label { font-weight: 700; font-size: 14px; }
        .my-status-row .hint { font-size: 12px; color: var(--s-text-dim); }
        .section-label { font-size: 12px; color: var(--s-text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 0 10px; }

        .status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .status-tile {
            position: relative; aspect-ratio: 9/16; border-radius: 14px; overflow: hidden; cursor: pointer;
            border: 2px solid var(--s-accent-cyan-dim); background: var(--s-panel);
            display: flex; align-items: center; justify-content: center;
        }
        .status-tile img, .status-tile video { width: 100%; height: 100%; object-fit: cover; }
        .status-tile.text-tile { padding: 10px; text-align: center; font-size: 13px; font-weight: 700; color: #fff; }
        .status-tile.audio-tile { flex-direction: column; gap: 8px; font-size: 30px; }
        .status-tile.audio-tile .audio-tile-label { font-size: 11px; font-weight: 700; color: #fff; }
        .status-tile .tile-name {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 6px; font-size: 11px; font-weight: 700;
            background: linear-gradient(transparent, rgba(0,0,0,0.75)); color: white;
        }
        .status-tile .tile-count {
            position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.55); color: #fff;
            font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px;
        }
        .empty-note { color: var(--s-text-dim); font-size: 13px; }

        .status-viewer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 3000;
            display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px;
        }
        .status-viewer.show { display: flex; }
        .status-viewer .close-btn {
            position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); color: white;
            border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; z-index: 10;
        }
        .status-viewer .delete-own-btn {
            position: absolute; top: 16px; right: 62px; background: rgba(220,53,69,0.85); color: white;
            border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 15px; cursor: pointer; z-index: 10;
        }

        /* Add-status chooser (photo/video vs voice vs text) */
        .add-status-menu {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 3100;
            display: none; align-items: flex-end; justify-content: center;
        }
        .add-status-menu.show { display: flex; }
        .add-status-menu .sheet {
            width: min(94vw, 420px); background: var(--s-bg-deep); border: 1px solid var(--s-panel-border);
            border-radius: 18px 18px 0 0; padding: 10px; margin-bottom: 0;
        }
        .add-status-menu button {
            width: 100%; text-align: left; background: none; border: none; color: var(--s-text);
            padding: 14px 10px; font-size: 14px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; gap: 12px;
        }
        .add-status-menu button:hover { background: rgba(255,255,255,0.06); }
        .add-status-menu .cancel-btn { color: var(--s-text-dim); margin-top: 4px; border-top: 1px solid var(--s-panel-border); }

        /* Text-status composer */
        .text-status-composer {
            position: fixed; inset: 0; z-index: 3200; display: none; flex-direction: column;
            align-items: center; justify-content: center; padding: 24px;
        }
        .text-status-composer.show { display: flex; }
        .text-status-composer textarea {
            width: min(94vw, 420px); min-height: 160px; border: none; background: transparent; color: #fff;
            font-size: 24px; font-weight: 700; text-align: center; resize: none; font-family: var(--font-body);
        }
        .text-status-composer textarea:focus { outline: none; }
        .text-status-composer .swatches { display: flex; gap: 10px; margin-top: 16px; }
        .text-status-composer .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .text-status-composer .swatch.active { border-color: #fff; }
        .text-status-composer .composer-actions { position: absolute; top: 20px; right: 20px; left: 20px; display: flex; justify-content: space-between; }
        .text-status-composer button.icon-btn {
            background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 50%;
            width: 38px; height: 38px; font-size: 16px; cursor: pointer;
        }

        /* Modern status viewer / live-story treatment */
        .status-wrap { max-width: 720px; padding-top: 8px; }
        .my-status-row {
            position: relative; overflow: hidden; min-height: 74px;
            background: linear-gradient(135deg, rgba(10,168,154,.16), rgba(8,30,42,.92));
            box-shadow: 0 14px 40px rgba(0,0,0,.18);
            transition: transform .2s ease, border-color .2s ease;
        }
        .my-status-row:hover { transform: translateY(-2px); border-color: var(--s-accent-cyan); }
        .status-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
        .status-tile {
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 12px 30px rgba(0,0,0,.2);
            transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
        }
        .status-tile:hover { transform: translateY(-4px) scale(1.015); border-color: var(--s-accent-cyan); box-shadow: 0 18px 40px rgba(0,0,0,.3); }
        .status-viewer { background: radial-gradient(circle at 50% 20%, rgba(10,168,154,.16), rgba(0,0,0,.95) 48%); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
        .status-viewer-track { width: min(94vw, 520px); height: min(90vh, 900px); position: relative; display:flex; flex-direction:column; }
        .status-progress-row { padding: 4px 0 10px; }
        .status-viewer-header { margin: 0 0 12px; padding: 10px 12px; border-radius: 16px; background: rgba(4,20,28,.55); backdrop-filter: blur(12px); }
        .status-viewer-media-frame { flex: 1; min-height: 0; border-radius: 24px; overflow:hidden; box-shadow: 0 24px 80px rgba(0,0,0,.48); border:1px solid rgba(255,255,255,.1); }
        .status-viewer-reply-row {
            position: relative; display:flex; align-items:flex-end; gap:8px; margin-top:12px; padding:8px;
            border:1px solid rgba(255,255,255,.12); border-radius:18px; background:rgba(4,20,28,.72);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow:0 12px 40px rgba(0,0,0,.28);
        }
        .status-viewer-reply-row input { flex:1; min-width:0; border:0; background:rgba(255,255,255,.07); color:#fff; border-radius:12px; padding:11px 13px; }
        .status-viewer-reply-row button { flex:0 0 42px; height:42px; border-radius:50%; border:0; background:linear-gradient(135deg,#0aa89a,#067a8f); color:#fff; cursor:pointer; }
        .status-reply-context {
            position:absolute; left:8px; right:8px; bottom:calc(100% + 8px); display:none;
            padding:9px 11px; border-left:3px solid var(--s-accent-cyan); border-radius:12px; color:#fff;
            background:linear-gradient(135deg,var(--status-context-bg,#0aa89a),rgba(0,0,0,.55));
            box-shadow:0 10px 30px rgba(0,0,0,.35); overflow:hidden;
        }
        .status-reply-context.show { display:flex; flex-direction:column; gap:3px; }
        .status-reply-context .kicker { font-size:10px; font-weight:800; opacity:.85; text-transform:uppercase; letter-spacing:.04em; }
        .status-reply-context .text { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    </style>
</head>
<body>

    <div class="titleandprofile">
        <img src="images/MY S.png" alt="S-Tech logo" width="80" height="75" class="profilepicture">
        <h1 class="h1-title">Status</h1>
    </div>

    <div class="status-wrap">
        <div class="my-status-row" id="my-status-row">
            <div class="avatar-wrap" id="my-status-avatar-wrap">
                <img id="my-status-avatar" src="images/MY S.png" alt="" class="avatar">
                <span class="add-badge" id="my-status-add-badge">+</span>
            </div>
            <div>
                <div class="label">My Status</div>
                <div class="hint" id="my-status-hint">Tap to add a status update</div>
            </div>
        </div>
        <input type="file" id="status-file-input" accept=".jpg,.jpeg,.png,.gif,.webp,.mp4,.mov,.webm,.ogg,.m4a,.mp3,.aac" style="display:none;">

        <div class="section-label">Recent Updates</div>
        <div id="status-feed" class="status-grid"></div>
    </div>

    <div class="pages-btn-container">
        <nav><a href="S-chat-home.html"><button class="primary-btn"><img src="my icons/chats-icon.png" alt="" width="20" height="20">Chats</button></a></nav>
        <nav><a href="S-chat-status.html"><button class="primary-btn"><img src="my icons/status-icon.png" alt="" width="20" height="20">Status</button></a></nav>
        <nav><a href="S-chat-calls.html"><button class="primary-btn"><img src="my icons/contact-icon.png" alt="" width="20" height="20">Calls</button></a></nav>
        <nav><a href="S-chat-settings.html"><button class="primary-btn"><img src="my icons/settings-icon.png" alt="" width="20" height="20">Settings</button></a></nav>
    </div>

    <!-- Add-status chooser: photo/video, voice note, or text -->
    <div class="add-status-menu" id="add-status-menu">
        <div class="sheet">
            <button type="button" id="add-status-media">\ud83d\udcf7 Photo or video</button>
            <button type="button" id="add-status-voice">\ud83c\udfa4 Voice note</button>
            <button type="button" id="add-status-text">Aa Text status</button>
            <button type="button" class="cancel-btn" id="add-status-cancel">Cancel</button>
        </div>
    </div>

    <!-- Text-status composer -->
    <div class="text-status-composer" id="text-status-composer">
        <div class="composer-actions">
            <button type="button" class="icon-btn" id="text-status-close">&times;</button>
            <button type="button" class="icon-btn" id="text-status-post">&#10148;</button>
        </div>
        <textarea id="text-status-input" maxlength="700" placeholder="Type a status..."></textarea>
        <div class="swatches" id="text-status-swatches"></div>
    </div>

    <!-- Per-friend swipeable status carousel -->
    <div class="status-viewer" id="status-viewer">
        <button class="delete-own-btn" id="status-viewer-delete" style="display:none;" aria-label="Delete status">&#128465;</button>
        <button class="close-btn" id="status-viewer-close" aria-label="Close">&times;</button>

        <div class="status-viewer-track" id="status-viewer-track">
            <div class="status-progress-row" id="status-progress-row"></div>
            <div class="status-viewer-header">
                <img id="sv-avatar" src="images/MY S.png" alt="">
                <div>
                    <div class="sv-name" id="sv-name"></div>
                    <div class="sv-time" id="sv-time"></div>
                </div>
            </div>

            <div class="status-viewer-media-frame" id="status-viewer-media"></div>

            <div class="status-nav-zone prev" id="status-nav-prev"></div>
            <div class="status-nav-zone next" id="status-nav-next"></div>

            <div class="status-viewer-reply-row" id="status-viewer-reply-row">
                <input type="text" id="status-reply-input" placeholder="Reply to status..." maxlength="1000">
                <button type="button" id="status-reply-send" aria-label="Send reply">&#10148;</button>
            </div>
        </div>
    </div>

    <!-- Voice-status recording indicator -->
    <div class="voice-recording-chip" id="status-voice-recording-chip" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);">
        <span class="voice-recording-dot"></span>
        <span class="voice-recording-time" id="status-voice-recording-time">0:00</span>
        <span class="voice-recording-label">Recording voice status\u2026</span>
        <button type="button" class="voice-recording-cancel" id="status-voice-recording-cancel" aria-label="Cancel">&times;</button>
        <button type="button" class="voice-recording-send" id="status-voice-recording-send" aria-label="Post voice status">&#10148;</button>
    </div>

    <script src="js/nav.js" defer></script>
    <script>
        (function () {
            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent = str || "";
                return div.innerHTML;
            }
            function isVideo(url) { return /\.(mp4|mov)$/i.test(url || ""); }
            function isAudio(url) { return /\.(ogg|m4a|mp3|aac)$/i.test(url || "") || /\.webm$/i.test(url || "") && !isVideo(url); }
            function timeAgo(iso) {
                const diffMs = Date.now() - new Date(iso).getTime();
                const mins = Math.floor(diffMs / 60000);
                if (mins < 1) return "Just now";
                if (mins < 60) return mins + "m ago";
                const hrs = Math.floor(mins / 60);
                return hrs + "h ago";
            }
            function mediaKind(status) {
                if (!status.mediaUrl) return "text";
                if (isAudio(status.mediaUrl)) return "audio";
                if (isVideo(status.mediaUrl)) return "video";
                return "image";
            }

            let myUserId = null;
            let myUsername = "You";
            let myAvatarUrl = "images/MY S.png";

            // =====================================================
            // FEED: group the flat /status/feed list into one
            // carousel entry per friend, media ordered oldest -> newest
            // within a friend, friends ordered by most recent post first.
            // Own statuses (from /status/mine) are kept in a separate
            // group, entered only from the "My Status" row.
            // =====================================================
            let groups = []; // [{ author, statuses: [...] }]  (friends only)
            let myGroup = null; // { author, statuses: [...] } | null

            function groupFeed(statuses) {
                const byAuthor = new Map();
                statuses.forEach((s) => {
                    const key = s.author.id;
                    if (!byAuthor.has(key)) byAuthor.set(key, { author: s.author, statuses: [] });
                    byAuthor.get(key).statuses.push(s);
                });
                const result = Array.from(byAuthor.values());
                result.forEach((g) => g.statuses.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)));
                result.sort((a, b) => {
                    const aLatest = a.statuses[a.statuses.length - 1].createdAt;
                    const bLatest = b.statuses[b.statuses.length - 1].createdAt;
                    return new Date(bLatest) - new Date(aLatest);
                });
                return result;
            }

            function renderTileContent(cover) {
                const kind = mediaKind(cover);
                if (kind === "video") return `<video src="${escapeHtml(cover.mediaUrl)}" muted></video>`;
                if (kind === "audio") return `<div class="audio-tile-icon">\ud83c\udfa4</div><div class="audio-tile-label">Voice</div>`;
                if (kind === "text") return escapeHtml(cover.textContent || "");
                return `<img src="${escapeHtml(cover.mediaUrl)}" alt="">`;
            }
            function tileClass(cover) {
                const kind = mediaKind(cover);
                if (kind === "text") return "text-tile";
                if (kind === "audio") return "audio-tile";
                return "";
            }

            async function loadFeed() {
                const feed = document.getElementById("status-feed");
                try {
                    const statuses = await SChat.apiFetch("/status/feed");
                    if (!statuses.length) {
                        feed.innerHTML = '<p class="empty-note">No updates from friends yet.</p>';
                        groups = [];
                        return;
                    }
                    groups = groupFeed(statuses);
                    feed.innerHTML = "";
                    groups.forEach((group, index) => {
                        const cover = group.statuses[group.statuses.length - 1];
                        const tile = document.createElement("div");
                        tile.className = "status-tile " + tileClass(cover);
                        if (mediaKind(cover) === "text") tile.style.background = cover.backgroundColor || "#0aa89a";
                        const countBadge = group.statuses.length > 1 ? `<span class="tile-count">${group.statuses.length}</span>` : "";
                        tile.innerHTML = `${renderTileContent(cover)}${countBadge}<div class="tile-name">${escapeHtml(group.author.username)}</div>`;
                        tile.addEventListener("click", () => openViewer(groups[index], index, group.statuses.length - 1, false));
                        feed.appendChild(tile);
                    });
                } catch (err) {
                    feed.innerHTML = `<p class="empty-note">${escapeHtml(err.message)}</p>`;
                }
            }

            async function loadMine() {
                try {
                    const mine = await SChat.apiFetch("/status/mine");
                    const avatarWrap = document.getElementById("my-status-avatar-wrap");
                    const hint = document.getElementById("my-status-hint");
                    if (mine.length) {
                        myGroup = { author: mine[0].author, statuses: mine.slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)) };
                        avatarWrap.classList.add("has-status");
                        hint.textContent = mine.length === 1 ? "Tap to view your status" : `Tap to view ${mine.length} updates`;
                        const coverMedia = myGroup.statuses[myGroup.statuses.length - 1].mediaUrl;
                        if (coverMedia && mediaKind(myGroup.statuses[myGroup.statuses.length - 1]) === "image") {
                            document.getElementById("my-status-avatar").src = coverMedia;
                        }
                    } else {
                        myGroup = null;
                        avatarWrap.classList.remove("has-status");
                        hint.textContent = "Tap to add a status update";
                    }
                } catch { /* leave defaults */ }
            }

            // =====================================================
            // VIEWER — a "combined" list is built lazily: friends' groups
            // plus, only when opened from "My Status", the own group.
            // =====================================================
            let activeGroups = [];
            let groupIndex = 0;
            let mediaIndex = 0;
            let viewingOwn = false;

            const viewer = document.getElementById("status-viewer");
            const mediaHost = document.getElementById("status-viewer-media");
            const progressRow = document.getElementById("status-progress-row");
            const svAvatar = document.getElementById("sv-avatar");
            const svName = document.getElementById("sv-name");
            const svTime = document.getElementById("sv-time");
            const replyInput = document.getElementById("status-reply-input");
            const replyRow = document.getElementById("status-viewer-reply-row");
            const deleteBtn = document.getElementById("status-viewer-delete");

            function currentStatus() {
                return activeGroups[groupIndex] ? activeGroups[groupIndex].statuses[mediaIndex] : null;
            }

            function renderProgress() {
                const group = activeGroups[groupIndex];
                progressRow.innerHTML = group.statuses.map((_, i) =>
                    `<span class="seg${i < mediaIndex ? " done" : ""}"><span class="fill" style="${i === mediaIndex ? "width:100%" : ""}"></span></span>`
                ).join("");
            }

            function renderCurrent() {
                const status = currentStatus();
                if (!status) { closeViewer(); return; }
                const group = activeGroups[groupIndex];
                const kind = mediaKind(status);

                if (kind === "text") {
                    mediaHost.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;
                        background:${escapeHtml(status.backgroundColor || '#0aa89a')};border-radius:14px;padding:24px;text-align:center;">
                        <span style="color:#fff;font-size:26px;font-weight:700;line-height:1.4;">${escapeHtml(status.textContent || "")}</span>
                    </div>`;
                } else if (kind === "audio") {
                    mediaHost.innerHTML = `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;">
                        <div style="font-size:60px;">\ud83c\udfa4</div>
                        <audio src="${escapeHtml(status.mediaUrl)}" controls autoplay style="width:80%;"></audio>
                    </div>`;
                } else if (kind === "video") {
                    mediaHost.innerHTML = `<video src="${escapeHtml(status.mediaUrl)}" controls autoplay playsinline></video>`;
                } else {
                    mediaHost.innerHTML = `<img src="${escapeHtml(status.mediaUrl)}" alt="">`;
                }

                svAvatar.src = group.author.profilePictureUrl || "images/MY S.png";
                svName.textContent = viewingOwn ? "You" : group.author.username;
                svTime.textContent = timeAgo(status.createdAt) + (status.caption ? " \u00b7 " + status.caption : "");

                replyRow.style.display = viewingOwn ? "none" : "flex";
                deleteBtn.style.display = viewingOwn ? "flex" : "none";
                renderProgress();
                replyInput.value = "";
            }

            function openViewer(group, index, mIndex, own) {
                viewingOwn = !!own;
                activeGroups = viewingOwn ? [myGroup] : groups;
                groupIndex = viewingOwn ? 0 : index;
                mediaIndex = mIndex != null ? mIndex : 0;
                viewer.classList.add("show");
                renderCurrent();
            }
            function closeViewer() {
                viewer.classList.remove("show");
                mediaHost.innerHTML = "";
            }
            document.getElementById("status-viewer-close").addEventListener("click", closeViewer);

            function nextMedia() {
                const group = activeGroups[groupIndex];
                if (mediaIndex < group.statuses.length - 1) { mediaIndex += 1; renderCurrent(); }
                else nextGroup();
            }
            function prevMedia() {
                if (mediaIndex > 0) { mediaIndex -= 1; renderCurrent(); }
                else prevGroup(true);
            }
            function nextGroup() {
                if (viewingOwn) { closeViewer(); return; } // only one group when viewing your own
                if (groupIndex < activeGroups.length - 1) { groupIndex += 1; mediaIndex = 0; renderCurrent(); }
                else closeViewer();
            }
            function prevGroup(landOnLast) {
                if (viewingOwn) { closeViewer(); return; }
                if (groupIndex > 0) { groupIndex -= 1; mediaIndex = landOnLast ? activeGroups[groupIndex].statuses.length - 1 : 0; renderCurrent(); }
                else closeViewer();
            }

            document.getElementById("status-nav-next").addEventListener("click", nextMedia);
            document.getElementById("status-nav-prev").addEventListener("click", prevMedia);

            const track = document.getElementById("status-viewer-track");
            const SWIPE_THRESHOLD = 70;
            let dragging = false, dragStartX = 0, dragDx = 0;

            track.addEventListener("pointerdown", (e) => {
                if (e.target.closest("#status-reply-input, #status-reply-send")) return;
                dragging = true;
                dragStartX = e.clientX;
                track.setPointerCapture(e.pointerId);
            });
            track.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                dragDx = e.clientX - dragStartX;
                track.style.transform = `translateX(${Math.max(-120, Math.min(120, dragDx)) * 0.4}px)`;
            });
            track.addEventListener("pointerup", () => {
                if (!dragging) return;
                dragging = false;
                track.style.transform = "";
                if (dragDx > SWIPE_THRESHOLD) prevMedia();
                else if (dragDx < -SWIPE_THRESHOLD) nextMedia();
                dragDx = 0;
            });
            track.addEventListener("pointercancel", () => { dragging = false; track.style.transform = ""; dragDx = 0; });

            document.addEventListener("keydown", (e) => {
                if (!viewer.classList.contains("show")) return;
                if (e.key === "ArrowRight") nextMedia();
                if (e.key === "ArrowLeft") prevMedia();
                if (e.key === "Escape") closeViewer();
            });

            // =====================================================
            // OWN-STATUS DELETE
            // =====================================================
            deleteBtn.addEventListener("click", async () => {
                const status = currentStatus();
                if (!status) return;
                if (!confirm("Delete this status update?")) return;
                try {
                    await SChat.apiFetch(`/status/${status.id}`, { method: "DELETE" });
                    myGroup.statuses.splice(mediaIndex, 1);
                    if (!myGroup.statuses.length) {
                        closeViewer();
                        myGroup = null;
                        loadMine();
                        return;
                    }
                    if (mediaIndex >= myGroup.statuses.length) mediaIndex = myGroup.statuses.length - 1;
                    activeGroups = [myGroup];
                    renderCurrent();
                    loadMine();
                } catch (err) {
                    SChat.showToast(err.message, "error");
                }
            });

            // =====================================================
            // STATUS REPLY (reuses the normal chat pipeline server-side)
            // =====================================================
            async function sendStatusReply() {
                const status = currentStatus();
                const content = replyInput.value.trim();
                if (!status || !content) return;
                try {
                    await SChat.apiFetch(`/status/${status.id}/reply`, { method: "POST", body: JSON.stringify({ content }) });
                    replyInput.value = "";
                    SChat.showToast("Reply sent", "success");
                } catch (err) {
                    SChat.showToast(err.message, "error");
                }
            }
            document.getElementById("status-reply-send").addEventListener("click", sendStatusReply);
            replyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendStatusReply(); } });

            // =====================================================
            // MY STATUS ROW — tap avatar to view own (if any), tap "+"
            // to open the add-status chooser.
            // =====================================================
            document.getElementById("my-status-row").addEventListener("click", (e) => {
                if (e.target.closest("#my-status-add-badge")) {
                    openAddStatusMenu();
                    return;
                }
                if (myGroup && myGroup.statuses.length) {
                    openViewer(null, null, myGroup.statuses.length - 1, true);
                } else {
                    openAddStatusMenu();
                }
            });

            function openAddStatusMenu() { document.getElementById("add-status-menu").classList.add("show"); }
            function closeAddStatusMenu() { document.getElementById("add-status-menu").classList.remove("show"); }
            document.getElementById("add-status-cancel").addEventListener("click", closeAddStatusMenu);
            document.getElementById("add-status-menu").addEventListener("click", (e) => {
                if (e.target.id === "add-status-menu") closeAddStatusMenu();
            });

            document.getElementById("add-status-media").addEventListener("click", () => {
                closeAddStatusMenu();
                document.getElementById("status-file-input").click();
            });

            // =====================================================
            // MEDIA (PHOTO/VIDEO) STATUS UPLOAD
            // =====================================================
            document.getElementById("status-file-input").addEventListener("change", async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const hint = document.getElementById("my-status-hint");
                const previousHint = hint.textContent;
                hint.textContent = "Uploading\u2026";
                try {
                    const fd = new FormData();
                    fd.append("file", file);
                    const caption = prompt("Add a caption (optional):") || "";
                    fd.append("caption", caption);
                    await SChat.apiUpload("/status", fd);
                    SChat.showToast("Status posted", "success");
                    loadFeed();
                    loadMine();
                } catch (err) {
                    hint.textContent = previousHint;
                    SChat.showToast(err.message, "error");
                }
                e.target.value = "";
            });

            // =====================================================
            // TEXT STATUS COMPOSER
            // =====================================================
            const TEXT_STATUS_COLORS = ["#0aa89a", "#7c3aed", "#dc2626", "#ea580c", "#0284c7", "#16a34a", "#111827"];
            let selectedBg = TEXT_STATUS_COLORS[0];

            function openTextComposer() {
                const swatchRow = document.getElementById("text-status-swatches");
                swatchRow.innerHTML = TEXT_STATUS_COLORS.map((c) =>
                    `<span class="swatch${c === selectedBg ? " active" : ""}" data-c="${c}" style="background:${c}"></span>`
                ).join("");
                swatchRow.querySelectorAll(".swatch").forEach((sw) => {
                    sw.addEventListener("click", () => {
                        selectedBg = sw.dataset.c;
                        document.getElementById("text-status-composer").style.background = selectedBg;
                        swatchRow.querySelectorAll(".swatch").forEach((s) => s.classList.toggle("active", s.dataset.c === selectedBg));
                    });
                });
                document.getElementById("text-status-composer").style.background = selectedBg;
                document.getElementById("text-status-input").value = "";
                document.getElementById("text-status-composer").classList.add("show");
                setTimeout(() => document.getElementById("text-status-input").focus(), 50);
            }
            function closeTextComposer() { document.getElementById("text-status-composer").classList.remove("show"); }

            document.getElementById("add-status-text").addEventListener("click", () => { closeAddStatusMenu(); openTextComposer(); });
            document.getElementById("text-status-close").addEventListener("click", closeTextComposer);
            document.getElementById("text-status-post").addEventListener("click", async () => {
                const text = document.getElementById("text-status-input").value.trim();
                if (!text) return;
                try {
                    const fd = new FormData();
                    fd.append("textContent", text);
                    fd.append("backgroundColor", selectedBg);
                    await SChat.apiUpload("/status", fd);
                    closeTextComposer();
                    SChat.showToast("Status posted", "success");
                    loadFeed();
                    loadMine();
                } catch (err) {
                    SChat.showToast(err.message, "error");
                }
            });

            // =====================================================
            // VOICE-NOTE STATUS — same MediaRecorder approach as
            // voice notes in chat, posted via the same /status endpoint.
            // =====================================================
            let statusRecorder = null;
            let statusChunks = [];
            let statusRecordStart = 0;
            let statusRecordTimer = null;
            let statusRecordStream = null;

            const statusRecChip = document.getElementById("status-voice-recording-chip");
            const statusRecTime = document.getElementById("status-voice-recording-time");

            function formatDuration(ms) {
                const totalSeconds = Math.floor(ms / 1000);
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                return m + ":" + String(s).padStart(2, "0");
            }

            function pickStatusAudioMimeType() {
                const candidates = [
                    "audio/webm;codecs=opus",
                    "audio/webm",
                    "audio/ogg;codecs=opus",
                    "audio/ogg",
                    "audio/mp4"
                ];
                return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
            }

            document.getElementById("add-status-voice").addEventListener("click", async () => {
                closeAddStatusMenu();
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
                    SChat.showToast("Voice status isn't supported on this browser.", "error");
                    return;
                }
                try {
                    statusRecordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch {
                    SChat.showToast("Microphone permission was denied.", "error");
                    return;
                }
                statusChunks = [];
                const preferredMime = pickStatusAudioMimeType();
                try {
                    statusRecorder = preferredMime ? new MediaRecorder(statusRecordStream, { mimeType: preferredMime }) : new MediaRecorder(statusRecordStream);
                } catch {
                    statusRecordStream.getTracks().forEach((t) => t.stop());
                    SChat.showToast("Could not start voice recording on this device.", "error");
                    return;
                }
                statusRecorder.addEventListener("dataavailable", (e) => { if (e.data.size > 0) statusChunks.push(e.data); });
                statusRecorder.start();
                statusRecordStart = Date.now();
                statusRecTime.textContent = "0:00";
                statusRecChip.classList.add("show");
                statusRecordTimer = setInterval(() => {
                    statusRecTime.textContent = formatDuration(Date.now() - statusRecordStart);
                }, 250);
            });

            function stopStatusRecordingUI() {
                clearInterval(statusRecordTimer);
                statusRecordTimer = null;
                statusRecChip.classList.remove("show");
            }

            document.getElementById("status-voice-recording-cancel").addEventListener("click", () => {
                if (statusRecorder && statusRecorder.state !== "inactive") statusRecorder.stop();
                if (statusRecordStream) statusRecordStream.getTracks().forEach((t) => t.stop());
                statusChunks = [];
                stopStatusRecordingUI();
            });

            document.getElementById("status-voice-recording-send").addEventListener("click", async () => {
                if (!statusRecorder || statusRecorder.state === "inactive") return;
                const finished = new Promise((resolve) => statusRecorder.addEventListener("stop", resolve, { once: true }));
                statusRecorder.stop();
                if (statusRecordStream) statusRecordStream.getTracks().forEach((t) => t.stop());
                stopStatusRecordingUI();
                await finished;

                if (!statusChunks.length) return;
                const mimeType = statusRecorder.mimeType || "audio/webm";
                const blob = new Blob(statusChunks, { type: mimeType });
                statusChunks = [];
                if (blob.size < 500) {
                    SChat.showToast("Recording was too short.", "error");
                    return;
                }
                try {
                    const extension = mimeType.includes("mp4") ? "m4a" : mimeType.includes("ogg") ? "ogg" : "webm";
                    const fd = new FormData();
                    fd.append("file", blob, `voice-status.${extension}`);
                    await SChat.apiUpload("/status", fd);
                    SChat.showToast("Voice status posted", "success");
                    loadFeed();
                    loadMine();
                } catch (err) {
                    SChat.showToast(err.message, "error");
                }
            });

            document.addEventListener("DOMContentLoaded", async () => {
                try {
                    const me = await SChat.apiFetch("/users/me");
                    myUserId = me.id;
                    myUsername = me.username;
                    if (me.profilePictureUrl) {
                        myAvatarUrl = me.profilePictureUrl;
                        document.getElementById("my-status-avatar").src = myAvatarUrl;
                    }
                } catch { /* stays default */ }
                loadFeed();
                loadMine();
            });
        })();
    </script>
</body>
</html>
