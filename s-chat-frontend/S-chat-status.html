<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status — S-Chat</title>
    <link rel="stylesheet" href="css/S-Chat-Style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <style>
        .status-wrap { max-width: 560px; margin: 0 auto 130px; padding: 0 16px; }
        .my-status-row {
            display: flex; align-items: center; gap: 14px; padding: 14px;
            background: var(--s-panel); border: 1px solid var(--s-panel-border); border-radius: 16px; margin-bottom: 18px;
        }
        .my-status-row .avatar-wrap { position: relative; }
        .my-status-row img.avatar { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.06); }
        .add-badge {
            position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; border-radius: 50%;
            background: var(--s-accent-cyan); color: #01192d; font-weight: 900; font-size: 14px;
            display: flex; align-items: center; justify-content: center; border: 2px solid var(--s-bg-deep);
        }
        .my-status-row .label { font-weight: 700; font-size: 14px; }
        .my-status-row .hint { font-size: 12px; color: var(--s-text-dim); }
        .section-label { font-size: 12px; color: var(--s-text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 0 10px; }

        .status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .status-tile {
            position: relative; aspect-ratio: 9/16; border-radius: 14px; overflow: hidden; cursor: pointer;
            border: 2px solid var(--s-accent-cyan-dim); background: var(--s-panel);
        }
        .status-tile img, .status-tile video { width: 100%; height: 100%; object-fit: cover; }
        .status-tile .tile-name {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 6px; font-size: 11px; font-weight: 700;
            background: linear-gradient(transparent, rgba(0,0,0,0.75)); color: white;
        }
        .empty-note { color: var(--s-text-dim); font-size: 13px; }

        .status-viewer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 3000;
            display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px;
        }
        .status-viewer.show { display: flex; }
        .status-viewer img, .status-viewer video { max-width: 100%; max-height: 75vh; border-radius: 12px; }
        .status-viewer .caption { color: white; margin-top: 12px; text-align: center; font-size: 14px; }
        .status-viewer .close-btn {
            position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); color: white;
            border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="titleandprofile">
        <img src="images/MY S.png" alt="S-Tech logo" width="80" height="75" class="profilepicture">
        <h1 class="h1-title">Status</h1>
    </div>

    <div class="status-wrap">
        <label class="my-status-row" for="status-file-input" style="cursor:pointer;">
            <div class="avatar-wrap">
                <img id="my-status-avatar" src="images/MY S.png" alt="" class="avatar">
                <span class="add-badge">+</span>
            </div>
            <div>
                <div class="label">My Status</div>
                <div class="hint" id="my-status-hint">Tap to post a photo or video</div>
            </div>
        </label>
        <input type="file" id="status-file-input" accept=".jpg,.jpeg,.png,.gif,.webp,.mp4,.mov" style="display:none;">

        <div class="section-label">Recent Updates</div>
        <div id="status-feed" class="status-grid"></div>
    </div>

    <div class="pages-btn-container">
        <nav><a href="S-chat-home.html"><button class="primary-btn"><img src="my icons/chats-icon.png" alt="" width="20" height="20">Chats</button></a></nav>
        <nav><a href="S-chat-status.html"><button class="primary-btn"><img src="my icons/status-icon.png" alt="" width="20" height="20">Status</button></a></nav>
        <nav><a href="S-chat-calls.html"><button class="primary-btn"><img src="my icons/contact-icon.png" alt="" width="20" height="20">Calls</button></a></nav>
        <nav><a href="S-chat-settings.html"><button class="primary-btn"><img src="my icons/settings-icon.png" alt="" width="20" height="20">Settings</button></a></nav>
    </div>

    <div class="status-viewer" id="status-viewer">
        <button class="close-btn" id="status-viewer-close">&times;</button>
        <div id="status-viewer-media"></div>
        <div class="caption" id="status-viewer-caption"></div>
    </div>

    <script src="js/nav.js" defer></script>
    <script>
        (function () {
            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent = str || "";
                return div.innerHTML;
            }
            function isVideo(url) { return /\.(mp4|mov)$/i.test(url); }

            async function loadFeed() {
                const feed = document.getElementById("status-feed");
                try {
                    const statuses = await SChat.apiFetch("/status/feed");
                    if (!statuses.length) {
                        feed.innerHTML = '<p class="empty-note">No updates from friends yet.</p>';
                        return;
                    }
                    feed.innerHTML = "";
                    statuses.forEach((s) => {
                        const tile = document.createElement("div");
                        tile.className = "status-tile";
                        const mediaTag = isVideo(s.mediaUrl)
                            ? `<video src="${s.mediaUrl}" muted></video>`
                            : `<img src="${s.mediaUrl}" alt="">`;
                        tile.innerHTML = `${mediaTag}<div class="tile-name">${escapeHtml(s.author.username)}</div>`;
                        tile.addEventListener("click", () => openViewer(s));
                        feed.appendChild(tile);
                    });
                } catch (err) {
                    feed.innerHTML = `<p class="empty-note">${escapeHtml(err.message)}</p>`;
                }
            }

            function openViewer(status) {
                const viewer = document.getElementById("status-viewer");
                const mediaHost = document.getElementById("status-viewer-media");
                mediaHost.innerHTML = isVideo(status.mediaUrl)
                    ? `<video src="${status.mediaUrl}" controls autoplay></video>`
                    : `<img src="${status.mediaUrl}" alt="">`;
                document.getElementById("status-viewer-caption").textContent = status.caption || "";
                viewer.classList.add("show");
            }
            document.getElementById("status-viewer-close").addEventListener("click", () => {
                const viewer = document.getElementById("status-viewer");
                viewer.classList.remove("show");
                document.getElementById("status-viewer-media").innerHTML = "";
            });

            document.getElementById("status-file-input").addEventListener("change", async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const hint = document.getElementById("my-status-hint");
                hint.textContent = "Uploading…";
                try {
                    const fd = new FormData();
                    fd.append("file", file);
                    const caption = prompt("Add a caption (optional):") || "";
                    fd.append("caption", caption);
                    await SChat.apiUpload("/status", fd);
                    hint.textContent = "Posted!";
                    setTimeout(() => (hint.textContent = "Tap to post a photo or video"), 2000);
                    loadFeed();
                } catch (err) {
                    hint.textContent = err.message;
                }
                e.target.value = "";
            });

            document.addEventListener("DOMContentLoaded", loadFeed);
        })();
    </script>
</body>
</html>
