<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>S-Chat</title>
  <meta name="description" content="S-Chat — fast one-to-one messaging with a personal chat link.">
  <meta name="theme-color" content="#140f8f">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="S-Chat">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="S-Chat">
  <meta property="og:description" content="Fast one-to-one messaging with a personal chat link.">
  <meta property="og:image" content="/assets/icon-512.png">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('schat_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script src="/js/config.js"></script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">S-Chat needs JavaScript enabled.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
