<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>S-Chat</title>
  <meta name="description" content="S-Chat — fast one-to-one messaging with a personal chat link.">
  <meta name="theme-color" content="#140f8f">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="S-Chat">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="S-Chat">
  <meta property="og:description" content="Fast one-to-one messaging with a personal chat link.">
  <meta property="og:image" content="/assets/icon-512.png">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme-init.js"></script>
  <script src="/js/config.js"></script>
</head>
<body>
  <div id="app">

    <!-- S-Chat Initial Loading Screen -->
    <div id="boot-loader" class="boot-loader" role="status" aria-label="Loading S-Chat">

        <video id="boot-video" muted autoplay loop playsinline preload="auto" disablepictureinpicture tabindex="-1" aria-hidden="true">
        </video>

        <!-- Fallback animation if video is unsupported -->
        <div class="boot-dots" aria-hidden="true">
            <i></i>
            <i></i>
            <i></i>
        </div>

    </div>

  </div>
  <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">S-Chat needs JavaScript enabled.</p></noscript>
  <script src="/js/boot-loader.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
