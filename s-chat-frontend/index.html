<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>S-Chat</title>
  <meta name="description" content="S-Chat — fast one-to-one messaging with a personal chat link.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="images/favicon-32x32.png">

    <link rel="apple-touch-icon"
          sizes="180x180"
          href="images/apple-touch-icon.png">
    <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('schat_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script src="/js/config.js"></script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">S-Chat needs JavaScript enabled.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
