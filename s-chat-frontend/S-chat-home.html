<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats — S-Chat</title>
    <link rel="stylesheet" href="css/S-Chat-Style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <style>

        .friend-row { position: relative; }
        .friend-row-menu {
            flex-shrink: 0; border: 0; background: transparent; color: var(--s-text-dim);
            font-size: 22px; line-height: 1; padding: 6px; cursor: pointer; border-radius: 8px;
        }
        .friend-row-menu:hover { background: rgba(255,255,255,.08); color: var(--s-text); }
        .friend-profile-modal {
            position: fixed; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center;
            padding: 20px; background: rgba(0,0,0,.68); backdrop-filter: blur(6px);
        }
        .friend-profile-modal.show { display: flex; }
        .friend-profile-card {
            position: relative; width: min(360px, 100%); padding: 26px 22px 22px; text-align: center;
            border-radius: 18px; background: var(--s-panel); border: 1px solid var(--s-accent-cyan-dim);
            box-shadow: 0 18px 60px rgba(0,0,0,.45);
        }
        .friend-profile-card > img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
        .friend-profile-card h2 { margin: 4px 0; }
        .friend-profile-id { color: var(--s-text-dim); font-size: 12px; margin-bottom: 18px; }
        .friend-profile-close { position:absolute; right:10px; top:8px; border:0; background:transparent; color:var(--s-text-dim); font-size:26px; cursor:pointer; }
        .friend-profile-actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
        .friend-profile-actions button { border:0; border-radius:9px; padding:9px 13px; cursor:pointer; background:rgba(255,255,255,.08); color:var(--s-text); }
        .friend-profile-actions button:first-child { background:var(--s-accent-cyan); color:#01192d; font-weight:700; }
        .friend-profile-actions button.danger { color:#ff9f9f; }

        .friend-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.15s ease;
        }
        .friend-row:hover,
        .friend-row:focus-visible {
            background: rgba(255,255,255,0.06);
        }
        .friend-row img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--s-panel);
            flex-shrink: 0;
        }
        .friend-row .friend-main {
            min-width: 0;
            flex: 1;
        }
        .friend-row .friend-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .friend-row .name {
            font-weight: 600;
            font-size: 14px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .friend-row .time {
            flex-shrink: 0;
            font-size: 10px;
            color: var(--s-text-dim);
        }
        .friend-row .sub {
            margin-top: 3px;
            font-size: 12px;
            color: var(--s-text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .friend-row .friend-main { display: flex; flex-direction: column; }
        .friend-row .sub-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; }
        .friend-row .sub-row .sub { margin-top: 0; flex: 1; }
        .unread-badge {
            flex-shrink: 0;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--s-accent-cyan);
            color: #01192d;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .friend-row.has-unread .name { font-weight: 800; }        .group-section{max-width:640px;margin:0 auto;padding:0 8px 8px}.group-section-head{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;color:var(--s-text-dim);font-size:12px}.group-create-btn{border:0;border-radius:9px;padding:8px 12px;background:var(--s-accent-cyan);color:#01192d;font-weight:700;cursor:pointer}.group-row{display:flex;align-items:center;gap:12px;padding:11px 10px;margin-bottom:4px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04)}.group-row:hover{background:rgba(255,255,255,.07)}.group-row img{width:44px;height:44px;border-radius:50%;object-fit:cover}.group-row .group-main{min-width:0;flex:1}.group-row .group-name{font-weight:700}.group-row .group-sub{font-size:11px;color:var(--s-text-dim);margin-top:3px}.group-modal{position:fixed;inset:0;z-index:6000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}.group-modal.show{display:flex}.group-card{width:min(430px,100%);max-height:85vh;overflow:auto;background:var(--s-panel);border:1px solid var(--s-accent-cyan-dim);border-radius:18px;padding:20px}.group-card h2{margin:0 0 14px}.group-card input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.2);color:var(--s-text);margin-bottom:12px}.group-friends{max-height:330px;overflow:auto}.group-friend-option{display:flex;align-items:center;gap:10px;padding:9px 4px}.group-friend-option img{width:38px;height:38px;border-radius:50%;object-fit:cover}.group-friend-option label{display:flex;align-items:center;gap:10px;width:100%;cursor:pointer}.group-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.group-modal-actions button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer}.group-cancel{background:rgba(255,255,255,.08);color:var(--s-text)}.group-submit{background:var(--s-accent-cyan);color:#01192d;font-weight:700}
        .friend-row.has-unread .sub { color: var(--s-text); }

        .notif-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            max-width: 640px;
            margin: 0 auto 10px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(7, 255, 243, 0.08);
            border: 1px solid var(--s-accent-cyan-dim);
            font-size: 13px;
        }
        .notif-banner.show { display: flex; }
        .notif-banner .notif-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .notif-banner button {
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .notif-banner .enable-btn { background: var(--s-accent-cyan); color: #01192d; font-weight: 700; }
        .notif-banner .dismiss-btn { background: rgba(255,255,255,0.08); color: var(--s-text-dim); }
        .empty-state {
            text-align: center;
            color: var(--s-text-dim);
            padding: 40px 20px;
            font-size: 14px;
        }

        /* Pinned AI Assistant row — always stays above real chats. */
        .ai-friend-row {
            border: 1px solid var(--s-accent-cyan-dim);
            background: rgba(7, 255, 243, 0.05);
            margin: 0 8px 4px;
        }
        .ai-friend-row:hover,
        .ai-friend-row:focus-visible {
            background: rgba(7, 255, 243, 0.1);
        }
        .ai-friend-row img {
            border: 2px solid var(--s-accent-cyan-dim);
            box-shadow: 0 0 12px var(--s-accent-cyan-dim);
        }
        .ai-friend-row .name { color: var(--s-accent-cyan); }

        @media (max-width: 420px) {
            .friend-row { padding: 11px 10px; gap: 10px; }
            .friend-row img { width: 44px; height: 44px; }
            .friend-row .name { font-size: 13px; }
            .friend-row .sub { font-size: 11px; }
            .friend-row .time { font-size: 9px; }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="titleandprofile" id="my-profile-header">
            <img src="images/MY S.png" alt="S-Tech logo" width="80" height="75" class="profilepicture" id="my-avatar">
            <div class="online-indicator"></div>
            <h1 class="h1-title">Chats</h1>
        </div>

        <div class="notif-banner" id="notif-banner">
            <span>Turn on notifications so you don't miss new messages.</span>
            <div class="notif-banner-actions">
                <button type="button" class="enable-btn" id="notif-enable-btn">Enable</button>
                <button type="button" class="dismiss-btn" id="notif-dismiss-btn">Not now</button>
            </div>
        </div>

        <div class="chat-home-searchbar">
            <form onsubmit="return false;">
                <input type="text" placeholder="Search chats..." class="chat-home-searchinput" id="chat-search-input" name="home-chat-searchinput" autocomplete="off">
                <button type="submit" name="home-chat-search-icon" class="home-chat-search-icon" aria-label="Search">
                    <img src="my icons/search-magnifire-icon.png" alt="" width="20" height="20">
                </button>
            </form>
        </div>

        <div class="friend-row ai-friend-row" id="ai-assistant-row" tabindex="0" role="button" aria-label="Open Gemini AI assistant"
             style="max-width: 640px; margin-left: auto; margin-right: auto;">
            <img src="images/MY S.png" alt="">
            <div class="friend-main">
                <div class="friend-topline">
                    <div class="name">Stech · S-Tech AI</div>
                </div>
                <div class="sub">Ask me anything</div>
            </div>
        </div>

        <div class="group-section">
            <div class="group-section-head"><span>GROUPS</span><button type="button" class="group-create-btn" id="create-group-btn">+ Create group</button></div>
            <div id="group-list"></div>
        </div>
        <div id="friend-list" style="padding: 8px 8px 140px; max-width: 640px; margin: 0 auto;"></div>

        <div class="group-modal" id="group-create-modal" aria-hidden="true">
            <div class="group-card" role="dialog" aria-modal="true" aria-labelledby="group-create-title">
                <h2 id="group-create-title">Create group</h2>
                <input id="group-name-input" type="text" maxlength="80" placeholder="Group name" autocomplete="off">
                <div class="group-friends" id="group-friends-list"></div>
                <div class="group-modal-actions"><button class="group-cancel" type="button" id="group-cancel-btn">Cancel</button><button class="group-submit" type="button" id="group-submit-btn">Create group</button></div>
            </div>
        </div>
    </div>


        <div class="friend-profile-modal" id="friend-profile-modal" aria-hidden="true">
            <div class="friend-profile-card" role="dialog" aria-modal="true" aria-labelledby="friend-profile-name">
                <button type="button" class="friend-profile-close" id="friend-profile-close" aria-label="Close">&times;</button>
                <img id="friend-profile-avatar" src="images/MY S.png" alt="Friend profile picture">
                <h2 id="friend-profile-name">Friend</h2>
                <div class="friend-profile-id" id="friend-profile-id"></div>
                <div class="friend-profile-actions">
                    <button type="button" id="friend-profile-chat">Chat</button>
                    <button type="button" id="friend-profile-block">Block</button>
                    <button type="button" id="friend-profile-remove" class="danger">Delete friend</button>
                </div>
            </div>
        </div>

    <div class="pages-btn-container">
        <nav><a href="S-chat-home.html"><button class="primary-btn"><img src="my icons/chats-icon.png" alt="" width="20" height="20">Chats</button></a></nav>
        <nav><a href="S-chat-status.html"><button class="primary-btn"><img src="my icons/status-icon.png" alt="" width="20" height="20">Status</button></a></nav>
        <nav><a href="S-chat-calls.html"><button class="primary-btn"><img src="my icons/contact-icon.png" alt="" width="20" height="20">Calls</button></a></nav>
        <nav><a href="S-chat-settings.html"><button class="primary-btn"><img src="my icons/settings-icon.png" alt="" width="20" height="20">Settings</button></a></nav>
    </div>

    <script src="js/nav.js" defer></script>
    <script src="js/friends.js" defer></script>
    <script src="js/group-chat.js" defer></script>
    <script src="js/ws-chat.js" defer></script>
    <script src="js/notifications.js" defer></script>
    <script>
        (function () {
            let allChats = [];
            let searchQuery = "";
            let reloadInProgress = false;

            function escapeHtml(value) {
                const div = document.createElement("div");
                div.textContent = value == null ? "" : String(value);
                return div.innerHTML;
            }

            function formatChatTime(value) {
                if (!value) return "";
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return "";

                const now = new Date();
                const sameDay = date.toDateString() === now.toDateString();
                if (sameDay) {
                    return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                }

                const yesterday = new Date(now);
                yesterday.setDate(now.getDate() - 1);
                if (date.toDateString() === yesterday.toDateString()) return "Yesterday";

                return date.toLocaleDateString([], { day: "2-digit", month: "2-digit" });
            }

            function latestPreview(chat) {
                if (chat.latestMessage) {
                    return chat.latestIsReply ? "↩️ " + chat.latestMessage : chat.latestMessage;
                }
                if (chat.latestAttachmentUrl) {
                    return /\.(mp4|mov|webm)$/i.test(chat.latestAttachmentUrl) ? "🎥 Video" : "📷 Photo";
                }
                return chat.otherUser.deleted ? "This user deleted their account" : "Tap to chat";
            }

            function renderFriends(chats) {
                const list = document.getElementById("friend-list");
                if (!list) return;
                list.innerHTML = "";

                const filtered = chats.filter((chat) => {
                    const username = (chat.otherUser?.username || "").toLowerCase();
                    return username.includes(searchQuery);
                });

                if (!filtered.length) {
                    list.innerHTML = searchQuery
                        ? '<div class="empty-state">No chats match your search.</div>'
                        : '<div class="empty-state">No chats yet. Add a friend from Settings to get started.</div>';
                    return;
                }

                filtered.forEach((chat) => {
                    const user = chat.otherUser;
                    const unread = chat.unreadCount || 0;
                    const row = document.createElement("div");
                    row.className = "friend-row" + (unread > 0 ? " has-unread" : "");
                    row.tabIndex = 0;
                    row.innerHTML = `
                        <img src="${escapeHtml(user.profilePictureUrl || 'images/MY S.png')}" alt="">
                        <div class="friend-main">
                            <div class="friend-topline">
                                <div class="name">${escapeHtml(user.username)}</div>
                                <div class="time">${escapeHtml(formatChatTime(chat.latestMessageAt))}</div>
                            </div>
                            <div class="sub-row">
                                <div class="sub">${escapeHtml(latestPreview(chat))}</div>
                                ${unread > 0 ? `<span class="unread-badge">${unread > 99 ? "99+" : unread}</span>` : ""}
                            </div>
                        </div>
                        <button type="button" class="friend-row-menu" aria-label="Friend options" title="Friend options">⋮</button>
                    `;

                    const open = () => {
                        window.location.href = `S-chat-chatpage.html?friend=${encodeURIComponent(user.id)}&name=${encodeURIComponent(user.username)}`;
                    };
                    const menuBtn = row.querySelector(".friend-row-menu");
                    menuBtn.addEventListener("click", async (e) => {
                        e.stopPropagation();
                        await openFriendProfile(user);
                    });
                    row.addEventListener("click", open);
                    row.addEventListener("keydown", (e) => {
                        if (e.target === menuBtn) return;
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            open();
                        }
                    });
                    list.appendChild(row);
                });
            }

            const profileModal = document.getElementById("friend-profile-modal");
            const profileAvatar = document.getElementById("friend-profile-avatar");
            const profileName = document.getElementById("friend-profile-name");
            const profileId = document.getElementById("friend-profile-id");
            let profileFriend = null;

            function closeFriendProfile() {
                profileModal.classList.remove("show");
                profileModal.setAttribute("aria-hidden", "true");
                profileFriend = null;
            }

            async function openFriendProfile(user) {
                profileFriend = user;
                profileAvatar.src = user.profilePictureUrl || "images/MY S.png";
                profileName.textContent = user.username || "Friend";
                profileId.textContent = "Loading profile…";
                profileModal.classList.add("show");
                profileModal.setAttribute("aria-hidden", "false");
                try {
                    const profile = await SChatFriends.profile(user.id);
                    if (!profileFriend || profileFriend.id !== user.id) return;
                    profileAvatar.src = profile.profilePictureUrl || "images/MY S.png";
                    profileName.textContent = profile.username || user.username || "Friend";
                    profileId.textContent = profile.publicId ? "S-Chat ID: " + profile.publicId : "";
                } catch (err) {
                    closeFriendProfile();
                    SChat.showToast(err.message, "error");
                }
            }

            document.getElementById("friend-profile-close").addEventListener("click", closeFriendProfile);
            profileModal.addEventListener("click", (e) => { if (e.target === profileModal) closeFriendProfile(); });
            document.getElementById("friend-profile-chat").addEventListener("click", () => {
                if (!profileFriend) return;
                window.location.href = `S-chat-chatpage.html?friend=${encodeURIComponent(profileFriend.id)}&name=${encodeURIComponent(profileFriend.username)}`;
            });
            document.getElementById("friend-profile-remove").addEventListener("click", async () => {
                if (!profileFriend || !confirm(`Delete ${profileFriend.username} from your friends/chat list? Your existing messages will remain stored.`)) return;
                try {
                    await SChatFriends.remove(profileFriend.id);
                    const removedId = profileFriend.id;
                    allChats = allChats.filter(c => c.otherUser?.id !== removedId);
                    renderFriends(allChats);
                    closeFriendProfile();
                    SChat.showToast("Friend removed", "success");
                } catch (err) { SChat.showToast(err.message, "error"); }
            });
            document.getElementById("friend-profile-block").addEventListener("click", async () => {
                if (!profileFriend || !confirm(`Block ${profileFriend.username}? They will no longer be able to message you.`)) return;
                try {
                    await SChatFriends.block(profileFriend.id);
                    const blockedId = profileFriend.id;
                    allChats = allChats.filter(c => c.otherUser?.id !== blockedId);
                    renderFriends(allChats);
                    closeFriendProfile();
                    SChat.showToast("Friend blocked", "success");
                } catch (err) { SChat.showToast(err.message, "error"); }
            });

            async function loadChats() {
                if (reloadInProgress) return;
                reloadInProgress = true;
                try {
                    allChats = await SChatFriends.myChats();
                    renderFriends(allChats);
                } catch (err) {
                    SChat.showToast(err.message, "error");
                } finally {
                    reloadInProgress = false;
                }
            }

            function updateFromIncomingMessage(data) {
                if (!data || data.type !== "chat" || !data.senderId) return;

                const index = allChats.findIndex((chat) => chat.otherUser?.id === data.senderId);
                if (index === -1) {
                    // A friendship may have been accepted in another tab. Reload to
                    // obtain the new friend and its latest message from the server.
                    loadChats();
                    return;
                }

                const chat = allChats[index];
                chat.latestMessage = data.content || null;
                chat.latestAttachmentUrl = data.attachmentUrl || null;
                chat.latestMessageAt = data.sentAt || new Date().toISOString();
                chat.latestSenderId = data.senderId;
                chat.latestIsReply = !!data.replyTo;
                chat.unreadCount = (chat.unreadCount || 0) + 1;

                // Move the active conversation to the top immediately.
                allChats.splice(index, 1);
                allChats.unshift(chat);
                renderFriends(allChats);

                if (typeof SChatNotify !== "undefined" && SChatNotify.shouldNotify()) {
                    const preview = chat.latestMessage || (chat.latestAttachmentUrl ? latestPreview(chat) : "New message");
                    SChatNotify.notify(chat.otherUser.username, preview, {
                        tag: "chat-" + chat.otherUser.id,
                        data: { url: `S-chat-chatpage.html?friend=${encodeURIComponent(chat.otherUser.id)}&name=${encodeURIComponent(chat.otherUser.username)}` }
                    });
                }
            }

            async function loadMyAvatar() {
                try {
                    const profile = await SChat.apiFetch("/users/me");
                    if (profile.profilePictureUrl) {
                        document.getElementById("my-avatar").src = profile.profilePictureUrl;
                    }
                } catch {
                    // Header stays on the default logo.
                }
            }

            function openAIAssistant() {
                window.location.href = "S-chat-chatpage.html?ai=1&name=" + encodeURIComponent("Stech");
            }

            function setupNotifications() {
                if (typeof SChatNotify === "undefined") return;
                SChatNotify.registerServiceWorker();

                const banner = document.getElementById("notif-banner");
                const dismissed = localStorage.getItem("sChatNotifDismissed") === "1";
                if (!dismissed && SChatNotify.permissionState() === "default") {
                    banner.classList.add("show");
                }

                document.getElementById("notif-enable-btn").addEventListener("click", async () => {
                    await SChatNotify.requestPermission();
                    banner.classList.remove("show");
                });
                document.getElementById("notif-dismiss-btn").addEventListener("click", () => {
                    localStorage.setItem("sChatNotifDismissed", "1");
                    banner.classList.remove("show");
                });
            }

            async function loadGroups() {
                const list = document.getElementById("group-list");
                if (!list) return;
                try {
                    const groups = await SChatGroups.list();
                    list.innerHTML = groups.length ? "" : '<div style="padding:6px 4px 10px;color:var(--s-text-dim);font-size:11px">No groups yet.</div>';
                    groups.forEach((g) => {
                        const row = document.createElement("div");
                        row.className = "group-row";
                        row.tabIndex = 0;
                        row.innerHTML = `<img src="${escapeHtml(g.avatarUrl || 'images/MY S.png')}" alt=""><div class="group-main"><div class="group-name">${escapeHtml(g.name)}</div><div class="group-sub">${g.memberCount} members · ${escapeHtml(g.myRole === 'ADMIN' ? 'Admin' : 'Member')}</div></div>`;
                        const open = () => { window.location.href = `S-chat-group-chat.html?group=${encodeURIComponent(g.id)}`; };
                        row.addEventListener("click", open);
                        row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
                        list.appendChild(row);
                    });
                } catch (err) { SChat.showToast(err.message, "error"); }
            }

            async function openCreateGroup() {
                const modal = document.getElementById("group-create-modal");
                const list = document.getElementById("group-friends-list");
                const name = document.getElementById("group-name-input");
                try {
                    const friends = await SChatFriends.myFriends();
                    list.innerHTML = friends.length ? "" : '<div style="padding:10px;color:var(--s-text-dim);font-size:12px">Add friends first before creating a group.</div>';
                    friends.forEach((f) => {
                        const u = f.otherUser;
                        const row = document.createElement("div");
                        row.className = "group-friend-option";
                        row.innerHTML = `<label><input type="checkbox" value="${escapeHtml(u.id)}"><img src="${escapeHtml(u.profilePictureUrl || 'images/MY S.png')}" alt=""><span>${escapeHtml(u.username)}</span></label>`;
                        list.appendChild(row);
                    });
                    name.value = "";
                    modal.classList.add("show");
                    modal.setAttribute("aria-hidden", "false");
                    name.focus();
                } catch (err) { SChat.showToast(err.message, "error"); }
            }

            function closeCreateGroup() {
                const modal = document.getElementById("group-create-modal");
                modal.classList.remove("show");
                modal.setAttribute("aria-hidden", "true");
            }

            async function createGroup() {
                const name = document.getElementById("group-name-input").value.trim();
                const memberIds = [...document.querySelectorAll("#group-friends-list input[type=checkbox]:checked")].map((x) => x.value);
                if (!name) { SChat.showToast("Enter a group name", "error"); return; }
                if (!memberIds.length) { SChat.showToast("Select at least one friend", "error"); return; }
                if (memberIds.length > 49) { SChat.showToast("A group can have at most 50 members", "error"); return; }
                try {
                    const group = await SChatGroups.create(name, memberIds);
                    closeCreateGroup();
                    window.location.href = `S-chat-group-chat.html?group=${encodeURIComponent(group.id)}`;
                } catch (err) { SChat.showToast(err.message, "error"); }
            }

            document.addEventListener("DOMContentLoaded", () => {
                const searchInput = document.getElementById("chat-search-input");
                searchInput.addEventListener("input", (e) => {
                    searchQuery = e.target.value.trim().toLowerCase();
                    renderFriends(allChats);
                });

                document.getElementById("create-group-btn").addEventListener("click", openCreateGroup);
                document.getElementById("group-cancel-btn").addEventListener("click", closeCreateGroup);
                document.getElementById("group-submit-btn").addEventListener("click", createGroup);
                document.getElementById("group-create-modal").addEventListener("click", (e) => { if (e.target.id === "group-create-modal") closeCreateGroup(); });

                document.getElementById("ai-assistant-row").addEventListener("click", openAIAssistant);
                document.getElementById("ai-assistant-row").addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        openAIAssistant();
                    }
                });

                loadChats();
                loadGroups();
                loadMyAvatar();
                setupNotifications();

                if (typeof SChatWS !== "undefined") {
                    SChatWS.connect();
                    SChatWS.onMessage((data) => { updateFromIncomingMessage(data); if (data && String(data.type || "").startsWith("group_")) loadGroups(); });
                }

                // Re-check when returning to this page/tab so a message sent from
                // another page/tab is reflected even though that tab did not receive
                // the WebSocket event itself.
                window.addEventListener("focus", loadChats);
                document.addEventListener("visibilitychange", () => {
                    if (!document.hidden) loadChats();
                });
            });
        })();
    </script>
</body>
</html>
