<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — S-Chat</title>
    <link rel="stylesheet" href="css/S-Chat-Style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
</head>
<body>

    <div class="app-shell">
        <div class="titleandprofile">
            <img src="images/MY S.png" alt="" width="80" height="75" class="profilepicture" id="peer-avatar">
            <h1 class="h1-title" id="peer-name">Chat</h1>
        </div>

        <div id="chat-thread" class="chat-thread"></div>
    </div>

    <form id="chat-send-form" onsubmit="return false;">
        <div class="chat-message-box-container">
            <textarea name="chat-message-box" id="chat-message-box" class="chat-message-box"
                placeholder="Message..." required rows="1" spellcheck="true"></textarea>

            <button class="send-chat-btn" id="send-chat-btn" type="submit" aria-label="Send message">
                <img src="my icons/send-icon.png" alt="" height="22" width="22">
            </button>

            <div class="chat-file-sender-box">
                <label for="chat-file-sender" class="chat-files-sender-icon" aria-label="Attach file">
                    <img src="my icons/files-extention-icon.png" alt="" height="20" width="20">
                </label>
                <input type="file" name="chat-file-sender" id="chat-file-sender" class="chat-file-sender"
                    accept=".jpg,.jpeg,.png,.gif,.webp,.mp4,.mov">
            </div>
        </div>
    </form>

    <script src="js/nav.js" defer></script>
    <script src="js/friends.js" defer></script>
    <script src="js/ws-chat.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const isAI = params.get("ai") === "1";
            const friendId = params.get("friend");
            const friendName = params.get("name") || (isAI ? "Gemini" : "Chat");

            const peerName = document.getElementById("peer-name");
            if (peerName) peerName.textContent = friendName;

            const thread = document.getElementById("chat-thread");

            if (!isAI && !friendId) {
                if (thread) {
                    thread.innerHTML = '<p style="text-align:center;color:var(--s-text-dim);padding:24px;">Open a chat from your Chats list.</p>';
                }
                return;
            }

            function renderMessage(msg, mine) {
                if (!thread) return;
                const bubble = document.createElement("div");
                bubble.className = "chat-bubble " + (mine ? "mine" : "theirs");

                const text = document.createElement("span");
                text.textContent = msg.content || "";
                bubble.appendChild(text);

                if (msg.attachmentUrl) {
                    const isVideo = /\.(mp4|mov)$/i.test(msg.attachmentUrl);
                    const media = document.createElement(isVideo ? "video" : "img");
                    media.src = msg.attachmentUrl;
                    if (isVideo) media.controls = true;
                    media.style.maxWidth = "100%";
                    media.style.borderRadius = "10px";
                    media.style.marginTop = "6px";
                    bubble.appendChild(media);
                }

                const meta = document.createElement("span");
                meta.className = "meta";
                meta.textContent = new Date(msg.sentAt || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                bubble.appendChild(meta);

                thread.appendChild(bubble);
                thread.scrollTop = thread.scrollHeight;
                return bubble;
            }

            /* =====================================================
               AI ASSISTANT MODE — same chat UI, no backend/WebSocket.
               Reachable only via the pinned "AI Assistant" row on
               S-chat-home.html (S-chat-home.html?ai=1 -> here).
               Swap getDemoResponse() for a real Gemini API call later.
               ===================================================== */
            if (isAI) {
                renderMessage({ content: "Hey! 👋 I'm Gemini, your S-Chat AI assistant. How can I help you today?" }, false);

                const fileBox = document.querySelector(".chat-file-sender-box");
                if (fileBox) fileBox.style.display = "none"; // no AI attachment support yet

                function getDemoResponse(message) {
                    const text = message.toLowerCase().trim();
                    if (text.includes("hello") || text.includes("hi") || text.includes("hey")) {
                        return "Hey! 👋 Nice to hear from you. How can I help?";
                    }
                    if (text.includes("who are you")) {
                        return "I'm Gemini, the AI assistant inside S-Chat. 🤖";
                    }
                    return "I'm here with you inside S-Chat 🤖. Running in local demo mode for now — the real model connects next.";
                }

                document.getElementById("chat-send-form").addEventListener("submit", () => {
                    const textarea = document.getElementById("chat-message-box");
                    const content = textarea.value.trim();
                    if (!content) return;

                    renderMessage({ content }, true);
                    textarea.value = "";

                    const typing = renderMessage({ content: "Gemini is typing..." }, false);
                    typing.style.opacity = "0.6";
                    typing.style.fontStyle = "italic";

                    setTimeout(() => {
                        typing.remove();
                        renderMessage({ content: getDemoResponse(content) }, false);
                    }, 700);
                });

                return; // skip all the friend-chat wiring below
            }

            /* =====================================================
               FRIEND CHAT MODE — real history + WebSocket
               ===================================================== */
            async function loadHistory() {
                try {
                    const messages = await SChat.apiFetch(`/chat/history/${friendId}?page=0&size=50`);
                    messages.slice().reverse().forEach((m) => renderMessage(m, m.senderId !== friendId));
                } catch (err) {
                    SChat.showToast(err.message, "error");
                }
            }

            if (typeof SChatWS !== "undefined") {
                SChatWS.connect();
                SChatWS.onMessage((data) => {
                    if (data.type === "chat" && data.senderId === friendId) {
                        renderMessage(data, false);
                    } else if (data.type === "error") {
                        SChat.showToast(data.message, "error");
                    }
                });
            }

            const chatForm = document.getElementById("chat-send-form");
            const textarea = document.getElementById("chat-message-box");
            const fileInput = document.getElementById("chat-file-sender");

            if (chatForm && textarea && fileInput && typeof SChatWS !== "undefined") {
                chatForm.addEventListener("submit", async () => {
                    const content = textarea.value.trim();
                    let attachmentUrl = null;

                    if (fileInput.files.length) {
                        const fd = new FormData();
                        fd.append("file", fileInput.files[0]);
                        try {
                            const result = await SChat.apiUpload("/chat/attachment", fd);
                            attachmentUrl = result.url;
                        } catch (err) {
                            SChat.showToast(err.message, "error");
                            return;
                        }
                    }

                    if (!content && !attachmentUrl) return;

                    const sent = SChatWS.send(friendId, content, attachmentUrl);
                    if (sent) {
                        renderMessage({ content, attachmentUrl, sentAt: new Date().toISOString() }, true);
                        textarea.value = "";
                        fileInput.value = "";
                    }
                });
            }

            loadHistory();
        });
    </script>
</body>
</html>
