            /* =====================================================
               AI ASSISTANT MODE
               ===================================================== */

            if (isAI) {

                /*
                 * FIX:
                 *
                 * The old code used:
                 *
                 *     const aiHistory = [];
                 *
                 * That meant the conversation existed only in RAM.
                 * Refreshing/reopening the AI chat created a brand-new
                 * empty array and the previous Gemini conversation was
                 * lost.
                 *
                 * The history is now persisted in localStorage.
                 *
                 * The key is isolated to this S-Chat AI conversation,
                 * so it does not touch normal friend-chat history.
                 */

                const AI_HISTORY_STORAGE_KEY =
                    "s-chat-gemini-history";

                let aiHistory = [];

                try {

                    const storedHistory =
                        localStorage.getItem(
                            AI_HISTORY_STORAGE_KEY
                        );

                    if (storedHistory) {

                        const parsed =
                            JSON.parse(
                                storedHistory
                            );

                        if (
                            Array.isArray(parsed)
                        ) {

                            aiHistory =
                                parsed.filter(
                                    (message) =>
                                        message &&
                                        (
                                            message.role === "user" ||
                                            message.role === "model"
                                        ) &&
                                        typeof message.content === "string"
                                );
                        }
                    }

                } catch (historyError) {

                    console.warn(
                        "Could not restore Gemini history:",
                        historyError
                    );

                    aiHistory = [];
                }

                function saveAIHistory() {

                    try {

                        localStorage.setItem(
                            AI_HISTORY_STORAGE_KEY,
                            JSON.stringify(
                                aiHistory
                            )
                        );

                    } catch (historyError) {

                        console.warn(
                            "Could not save Gemini history:",
                            historyError
                        );
                    }
                }

                /*
                 * Restore the previous conversation into the visible
                 * chat window instead of displaying only the greeting.
                 */
                if (aiHistory.length) {

                    aiHistory.forEach(
                        (message) => {

                            renderMessage(
                                {
                                    content:
                                        message.content
                                },
                                message.role === "user"
                            );
                        }
                    );

                    requestAnimationFrame(
                        () =>
                            scrollChatToBottom(
                                false
                            )
                    );

                } else {

                    /*
                     * First-time AI conversation only.
                     */
                    const welcomeMessage =
                        "Hi😊! 👋 I'm Stech, your S-Chat AI assistant. How can I help you today?";

                    renderMessage(
                        {
                            content:
                                welcomeMessage
                        },
                        false
                    );
                }

                const fileBox =
                    document.querySelector(
                        ".chat-file-sender-box"
                    );

                if (fileBox) {
                    fileBox.style.display =
                        "none";
                }

                const voiceBtnEl =
                    document.getElementById(
                        "voice-note-btn"
                    );

                if (voiceBtnEl) {
                    voiceBtnEl.style.display =
                        "none";
                }

                const sendBtnEl =
                    document.getElementById(
                        "send-chat-btn"
                    );

                if (sendBtnEl) {
                    sendBtnEl.hidden = false;
                }

                /*
                 * IMPORTANT:
                 * We do NOT add the welcome message to aiHistory.
                 *
                 * It is only a UI greeting. This prevents the greeting
                 * from becoming part of every Gemini request.
                 */

                document
                    .getElementById(
                        "chat-send-form"
                    )
                    .addEventListener(
                        "submit",
                        async () => {

                            const textarea =
                                document.getElementById(
                                    "chat-message-box"
                                );

                            const content =
                                textarea.value.trim();

                            if (!content) {
                                return;
                            }

                            /*
                             * Render user's message immediately.
                             */
                            renderMessage(
                                {
                                    content
                                },
                                true
                            );

                            textarea.value = "";

                            /*
                             * Add user's message to persistent history.
                             */
                            aiHistory.push(
                                {
                                    role: "user",
                                    content
                                }
                            );

                            saveAIHistory();

                            /*
                             * Temporary typing indicator.
                             *
                             * This is intentionally kept because it is
                             * only a temporary UI row and is NOT stored
                             * inside aiHistory.
                             */
                            const typingRow =
                                renderMessage(
                                    {
                                        content:
                                            "Štêch is typing..."
                                    },
                                    false
                                );

                            const typingBubble =
                                typingRow.querySelector(
                                    ".chat-bubble"
                                );

                            typingBubble.style.opacity =
                                "0.6";

                            typingBubble.style.fontStyle =
                                "italic";

                            try {

                                /*
                                 * Send the ENTIRE persisted conversation
                                 * to the backend, not just the latest
                                 * message.
                                 */
                                const response =
                                    await SChat.apiFetch(
                                        "/ai/chat",
                                        {
                                            method: "POST",
                                            body:
                                                JSON.stringify({
                                                    messages:
                                                        aiHistory
                                                })
                                        }
                                    );

                                /*
                                 * Remove temporary typing indicator.
                                 */
                                typingRow.remove();

                                const aiReply =
                                    response.text ||
                                    "";

                                /*
                                 * Render Gemini's response.
                                 */
                                renderMessage(
                                    {
                                        content:
                                            aiReply
                                    },
                                    false
                                );

                                /*
                                 * Save Gemini's response into the same
                                 * persistent conversation history.
                                 */
                                aiHistory.push(
                                    {
                                        role: "model",
                                        content:
                                            aiReply
                                    }
                                );

                                saveAIHistory();

                                requestAnimationFrame(
                                    () =>
                                        scrollChatToBottom(
                                            true
                                        )
                                );

                            } catch (err) {

                                typingRow.remove();

                                /*
                                 * We deliberately DO NOT push an AI
                                 * response into history when the request
                                 * fails.
                                 *
                                 * The user's message remains in history,
                                 * allowing the next request to retry
                                 * using the correct conversation context.
                                 */
                                renderMessage(
                                    {
                                        content:
                                            "⚠️ " +
                                            err.message
                                    },
                                    false
                                );

                                saveAIHistory();
                            }
                        }
                    );

                /*
                 * Gemini composer:
                 *
                 * Enter       = Send
                 * Shift+Enter = New line
                 */
                document
                    .getElementById(
                        "chat-message-box"
                    )
                    .addEventListener(
                        "keydown",
                        (event) => {

                            if (
                                event.key !== "Enter" ||
                                event.shiftKey ||
                                event.isComposing
                            ) {
                                return;
                            }

                            event.preventDefault();

                            document
                                .getElementById(
                                    "chat-send-form"
                                )
                                ?.requestSubmit();
                        }
                    );

                /*
                 * Send is the only composer action in AI mode.
                 */
                return;
            }

            /* =====================================================
               FRIEND CHAT MODE
               ===================================================== */

            async function loadHistory() {

                try {

                    const messages =
                        await SChat.apiFetch(
                            `/chat/history/${friendId}?page=0&size=50`
                        );

                    messages
                        .slice()
                        .reverse()
                        .forEach(
                            (m) =>
                                renderMessage(
                                    m,
                                    m.senderId !== friendId
                                )
                        );

                    requestAnimationFrame(
                        () =>
                            scrollChatToBottom(
                                false
                            )
                    );

                } catch (err) {

                    SChat.showToast(
                        err.message,
                        "error"
                    );
                }

                markConversationRead();
            }

            function markConversationRead() {

                SChat.apiFetch(
                    `/chat/read/${friendId}`,
                    {
                        method: "POST"
                    }
                ).catch(() => {});
            }

            const pendingRows = new Map();

            if (
                typeof SChatWS !==
                "undefined"
            ) {

                SChatWS.connect();

                SChatWS.onMessage(
                    (data) => {

                        if (
                            data.type === "chat" &&
                            data.senderId === friendId
                        ) {

                            renderMessage(
                                {
                                    id: data.id,
                                    content: data.content,
                                    attachmentUrl:
                                        data.attachmentUrl,
                                    sentAt: data.sentAt,
                                    senderId:
                                        data.senderId,
                                    replyTo:
                                        data.replyTo ||
                                        null,
                                    replyToStatus:
                                        data.replyToStatus ||
                                        null,
                                    reactions: []
                                },
                                false
                            );

                            if (
                                !document.hidden &&
                                document.hasFocus()
                            ) {

                                markConversationRead();

                            } else if (
                                typeof SChatNotify !==
                                "undefined" &&
                                SChatNotify.shouldNotify()
                            ) {

                                const preview =
                                    data.content ||
                                    (
                                        data.attachmentUrl
                                            ? attachmentLabel(
                                                data.attachmentUrl
                                            )
                                            : "New message"
                                    );

                                SChatNotify.notify(
                                    friendName,
                                    preview,
                                    {
                                        tag:
                                            "chat-" +
                                            friendId,

                                        data: {
                                            url:
                                                `S-chat-chatpage.html?friend=${encodeURIComponent(friendId)}&name=${encodeURIComponent(friendName)}`
                                        }
                                    }
                                );
                            }

                        } else if (
                            data.type === "ack"
                        ) {

                            const key =
                                data.clientMessageId;

                            const pending =
                                key
                                    ? pendingRows.get(key)
                                    : null;

                            if (pending) {

                                pending.dataset.messageId =
                                    data.id;

                                pendingRows.delete(
                                    key
                                );
                            }

                        } else if (
                            data.type === "reaction"
                        ) {

                            const row =
                                thread.querySelector(
                                    `[data-message-id="${CSS.escape(data.messageId)}"]`
                                );

                            if (row) {

                                applyReactionUpdate(
                                    row,
                                    data.reactions
                                );
                            }

                        } else if (
                            data.type ===
                            "message_deleted"
                        ) {

                            const row =
                                thread.querySelector(
                                    `[data-message-id="${CSS.escape(data.id)}"]`
                                );

                            if (row) {

                                const bubble =
                                    row.querySelector(
                                        ".chat-bubble"
                                    );

                                if (bubble) {

                                    bubble.classList.add(
                                        "deleted-message"
                                    );

                                    const meta =
                                        bubble.querySelector(
                                            ".meta"
                                        );

                                    bubble.innerHTML = `
                                        <span class="bubble-text">
                                            This message was deleted
                                        </span>
                                    `;

                                    if (meta) {
                                        bubble.appendChild(
                                            meta
                                        );
                                    }
                                }

                                const bar =
                                    row.querySelector(
                                        ".reaction-bar"
                                    );

                                if (bar) {
                                    bar.remove();
                                }
                            }

                        } else if (
                            data.type === "read" &&
                            data.conversationWith ===
                                friendId
                        ) {

                            (
                                data.messageIds ||
                                []
                            ).forEach(
                                (id) => {

                                    const row =
                                        thread.querySelector(
                                            `[data-message-id="${CSS.escape(id)}"]`
                                        );

                                    if (row) {
                                        markRowRead(
                                            row
                                        );
                                    }
                                }
                            );

                        } else if (
                            data.type === "error"
                        ) {

                            SChat.showToast(
                                data.message,
                                "error"
                            );
                        }
                    }
                );
            }

            document.addEventListener(
                "visibilitychange",
                () => {

                    if (
                        !document.hidden &&
                        !isAI &&
                        friendId
                    ) {
                        markConversationRead();
                    }
                }
            );

            const chatForm =
                document.getElementById(
                    "chat-send-form"
                );

            const textarea =
                document.getElementById(
                    "chat-message-box"
                );

            const fileInput =
                document.getElementById(
                    "chat-file-sender"
                );
                // Friend chat: Enter sends; Shift+Enter inserts a new line.
            textarea.addEventListener("keydown", (event) => {
                 if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;

                    event.preventDefault();

                     chatForm?.requestSubmit();
            });

            if (
                chatForm &&
                textarea &&
                fileInput &&
                typeof SChatWS !==
                    "undefined"
            ) {

                const selectedFiles = [];

                const previewChip =
                    document.getElementById(
                        "file-preview-chip"
                    );

                const previewList =
                    document.getElementById(
                        "file-preview-list"
                    );

                function formatBytes(bytes) {

                    if (!bytes) {
                        return "0 B";
                    }

                    const units =
                        ["B", "KB", "MB", "GB"];

                    const i =
                        Math.min(
                            Math.floor(
                                Math.log(bytes) /
                                Math.log(1024)
                            ),
                            units.length - 1
                        );

                    return (
                        bytes /
                        Math.pow(1024, i)
                    ).toFixed(
                        i ? 1 : 0
                    ) +
                    " " +
                    units[i];
                }

                function renderAttachmentTray() {

                    previewList.innerHTML = "";

                    selectedFiles.forEach(
                        (file, index) => {

                            const item =
                                document.createElement(
                                    "div"
                                );

                            item.className =
                                "file-preview-item";

                            const thumb =
                                file.type.startsWith(
                                    "image/"
                                )
                                    ? `
                                        <img
                                            src="${URL.createObjectURL(file)}"
                                            alt=""
                                        >
                                    `
                                    : `
                                        <span class="file-preview-glyph">
                                            ${
                                                file.type.startsWith("video/")
                                                    ? "🎬"
                                                    : file.type.startsWith("audio/")
                                                        ? "🎙️"
                                                        : "📎"
                                            }
                                        </span>
                                    `;

                            item.innerHTML = `
                                ${thumb}

                                <span class="file-preview-meta">
                                    <strong>
                                        ${escapeHtml(file.name)}
                                    </strong>

                                    <small>
                                        ${formatBytes(file.size)}
                                    </small>

                                    <span class="file-upload-progress">
                                        <i></i>
                                    </span>
                                </span>

                                <button
                                    type="button"
                                    aria-label="Remove ${escapeHtml(file.name)}"
                                >
                                    ×
                                </button>
                            `;

                            item
                                .querySelector("button")
                                .addEventListener(
                                    "click",
                                    () => {

                                        selectedFiles.splice(
                                            index,
                                            1
                                        );

                                        renderAttachmentTray();
                                        updateComposerButtons();
                                    }
                                );

                            previewList.appendChild(
                                item
                            );
                        }
                    );

                    previewChip.classList.toggle(
                        "show",
                        selectedFiles.length > 0
                    );
                }

                function setFiles(fileList) {

                    const maxBytes =
                        50 * 1024 * 1024;

                    for (
                        const file of Array.from(
                            fileList || []
                        )
                    ) {

                        if (
                            file.size >
                            maxBytes
                        ) {

                            SChat.showToast(
                                `${file.name} is larger than 50 MB.`,
                                "error"
                            );

                            continue;
                        }

                        if (
                            !selectedFiles.some(
                                f =>
                                    f.name ===
                                        file.name &&
                                    f.size ===
                                        file.size &&
                                    f.lastModified ===
                                        file.lastModified
                            )
                        ) {

                            selectedFiles.push(
                                file
                            );
                        }
                    }

                    renderAttachmentTray();
                    updateComposerButtons();
                }

                fileInput.addEventListener(
                    "change",
                    () => {

                        setFiles(
                            fileInput.files
                        );

                        fileInput.value = "";
                    }
                );

                [
                    "dragenter",
                    "dragover"
                ].forEach(
                    type =>
                        chatForm.addEventListener(
                            type,
                            e => {

                                e.preventDefault();

                                chatForm.classList.add(
                                    "drag-over"
                                );
                            }
                        )
                );

                [
                    "dragleave",
                    "drop"
                ].forEach(
                    type =>
                        chatForm.addEventListener(
                            type,
                            e => {

                                e.preventDefault();

                                chatForm.classList.remove(
                                    "drag-over"
                                );
                            }
                        )
                );

                chatForm.addEventListener(
                    "drop",
                    e =>
                        setFiles(
                            e.dataTransfer.files
                        )
                );

                textarea.addEventListener(
                    "paste",
                    e => {

                        const files =
                            Array.from(
                                e.clipboardData?.files ||
                                []
                            );

                        if (files.length) {
                            setFiles(files);
                        }
                    }
                );

                document
                    .getElementById(
                        "file-preview-remove"
                    )
                    .addEventListener(
                        "click",
                        () => {

                            selectedFiles.length = 0;

                            renderAttachmentTray();
                            updateComposerButtons();
                        }
                    );

                let uploadingAttachments =
                    false;

                chatForm.addEventListener(
                    "submit",
                    async event => {

                        event.preventDefault();

                        if (
                            uploadingAttachments
                        ) {
                            return;
                        }

                        const content =
                            textarea.value.trim();

                        if (
                            !content &&
                            !selectedFiles.length
                        ) {
                            return;
                        }

                        const filesToSend =
                            selectedFiles.slice();

                        const replyToMessageId =
                            replyingTo
                                ? replyingTo.id
                                : null;

                        uploadingAttachments =
                            filesToSend.length >
                            0;

                        for (
                            let i = 0;
                            i < filesToSend.length;
                            i++
                        ) {

                            const file =
                                filesToSend[i];

                            try {

                                const fd =
                                    new FormData();

                                fd.append(
                                    "file",
                                    file,
                                    file.name
                                );

                                const item =
                                    previewList
                                        .children[i];

                                const bar =
                                    item?.querySelector(
                                        ".file-upload-progress i"
                                    );

                                const result =
                                    await SChat.apiUploadWithProgress(
                                        "/chat/attachment",
                                        fd,
                                        p => {

                                            if (bar) {
                                                bar.style.width =
                                                    `${Math.round(p * 100)}%`;
                                            }
                                        }
                                    );

                                const clientMessageId =
                                    crypto.randomUUID
                                        ? crypto.randomUUID()
                                        : Date.now()
                                              .toString(36) +
                                          "-" +
                                          Math.random()
                                              .toString(36)
                                              .slice(2);

                                const sent =
                                    SChatWS.send(
                                        friendId,
                                        i === 0
                                            ? content
                                            : "",
                                        result.url,
                                        replyToMessageId,
                                        clientMessageId
                                    );

                                if (sent) {

                                    const replyToSnapshot =
                                        replyingTo
                                            ? {
                                                messageId:
                                                    replyingTo.id,
                                                senderId:
                                                    replyingTo.senderId,
                                                snippet:
                                                    replyingTo.content,
                                                attachmentUrl:
                                                    replyingTo.attachmentUrl ||
                                                    null,
                                                deleted:
                                                    false
                                            }
                                            : null;

                                    pendingRows.set(
                                        clientMessageId,
                                        renderMessage(
                                            {
                                                content:
                                                    i === 0
                                                        ? content
                                                        : "",
                                                attachmentUrl:
                                                    result.url,
                                                sentAt:
                                                    new Date().toISOString(),
                                                senderId:
                                                    myUserId,
                                                replyTo:
                                                    replyToSnapshot,
                                                reactions:
                                                    []
                                            },
                                            true
                                        )
                                    );
                                }

                            } catch (err) {

                                SChat.showToast(
                                    `Could not send ${file.name}: ${err.message}`,
                                    "error"
                                );
                            }
                        }

                        if (
                            content &&
                            !filesToSend.length
                        ) {

                            const clientMessageId =
                                crypto.randomUUID
                                    ? crypto.randomUUID()
                                    : Date.now()
                                          .toString(36) +
                                      "-" +
                                      Math.random()
                                          .toString(36)
                                          .slice(2);

                            const sent =
                                SChatWS.send(
                                    friendId,
                                    content,
                                    null,
                                    replyToMessageId,
                                    clientMessageId
                                );

                            if (sent) {

                                const replyToSnapshot =
                                    replyingTo
                                        ? {
                                            messageId:
                                                replyingTo.id,
                                            senderId:
                                                replyingTo.senderId,
                                            snippet:
                                                replyingTo.content,
                                            attachmentUrl:
                                                replyingTo.attachmentUrl ||
                                                null,
                                            deleted:
                                                false
                                        }
                                        : null;

                                pendingRows.set(
                                    clientMessageId,
                                    renderMessage(
                                        {
                                            content,
                                            attachmentUrl:
                                                null,
                                            sentAt:
                                                new Date().toISOString(),
                                            senderId:
                                                myUserId,
                                            replyTo:
                                                replyToSnapshot,
                                            reactions:
                                                []
                                        },
                                        true
                                    )
                                );
                            }
                        }

                        selectedFiles.length = 0;

                        uploadingAttachments =
                            false;

                        renderAttachmentTray();

                        textarea.value = "";

                        cancelReply();

                        updateComposerButtons();
                    }
                );
            }

            /* =====================================================
               COMPOSER BUTTONS
               ===================================================== */

            const textareaForButtons =
                document.getElementById(
                    "chat-message-box"
                );

            function updateComposerButtons() {

                const voiceBtn =
                    document.getElementById(
                        "voice-note-btn"
                    );

                const sendBtn =
                    document.getElementById(
                        "send-chat-btn"
                    );

                const hasText =
                    !!textareaForButtons?.value.trim();

                const hasFiles =
                    !!document
                        .getElementById(
                            "file-preview-list"
                        )
                        ?.children.length;

                if (sendBtn) {
                    sendBtn.hidden =
                        !(hasText || hasFiles);
                }

                if (voiceBtn) {
                    voiceBtn.hidden =
                        hasText || hasFiles;
                }
            }

            textareaForButtons?.addEventListener(
                "input",
                updateComposerButtons
            );

            updateComposerButtons();

            /* =====================================================
               VOICE NOTES
               ===================================================== */

            let mediaRecorder = null;
            let recordedChunks = [];
            let recordingStartedAt = 0;
            let recordingTimer = null;

            const recordingChip =
                document.getElementById(
                    "voice-recording-chip"
                );

            const recordingTimeEl =
                document.getElementById(
                    "voice-recording-time"
                );

            function pickAudioMimeType() {

                const candidates = [
                    "audio/webm;codecs=opus",
                    "audio/webm",
                    "audio/mp4",
                    "audio/ogg;codecs=opus"
                ];

                for (
                    const type of candidates
                ) {

                    if (
                        window.MediaRecorder &&
                        MediaRecorder.isTypeSupported &&
                        MediaRecorder.isTypeSupported(type)
                    ) {
                        return type;
                    }
                }

                return "";
            }

            function formatDuration(ms) {

                const totalSeconds =
                    Math.floor(ms / 1000);

                const m =
                    Math.floor(
                        totalSeconds / 60
                    );

                const s =
                    totalSeconds % 60;

                return (
                    m +
                    ":" +
                    String(s).padStart(2, "0")
                );
            }

            async function startRecording() {

                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia ||
                    !window.MediaRecorder
                ) {

                    SChat.showToast(
                        "Voice notes aren't supported on this browser.",
                        "error"
                    );

                    return;
                }

                let stream;

                try {

                    stream =
                        await navigator.mediaDevices.getUserMedia(
                            {
                                audio: true
                            }
                        );

                } catch {

                    SChat.showToast(
                        "Microphone permission was denied.",
                        "error"
                    );

                    return;
                }

                const mimeType =
                    pickAudioMimeType();

                recordedChunks = [];

                try {

                    mediaRecorder =
                        mimeType
                            ? new MediaRecorder(
                                stream,
                                {
                                    mimeType
                                }
                            )
                            : new MediaRecorder(
                                stream
                            );

                } catch {

                    SChat.showToast(
                        "Could not start recording on this device.",
                        "error"
                    );

                    stream
                        .getTracks()
                        .forEach(
                            t => t.stop()
                        );

                    return;
                }

                mediaRecorder.addEventListener(
                    "dataavailable",
                    e => {

                        if (
                            e.data &&
                            e.data.size > 0
                        ) {
                            recordedChunks.push(
                                e.data
                            );
                        }
                    }
                );

                mediaRecorder.addEventListener(
                    "stop",
                    () => {

                        stream
                            .getTracks()
                            .forEach(
                                t => t.stop()
                            );
                    }
                );

                mediaRecorder.start();

                recordingStartedAt =
                    Date.now();

                recordingTimeEl.textContent =
                    "0:00";

                recordingChip.classList.add(
                    "show"
                );

                recordingTimer =
                    setInterval(
                        () => {

                            recordingTimeEl.textContent =
                                formatDuration(
                                    Date.now() -
                                    recordingStartedAt
                                );

                        },
                        250
                    );
            }

            function stopRecordingUI() {

                clearInterval(
                    recordingTimer
                );

                recordingTimer = null;

                recordingChip.classList.remove(
                    "show"
                );
            }

            function cancelRecording() {

                if (
                    mediaRecorder &&
                    mediaRecorder.state !==
                        "inactive"
                ) {

                    recordedChunks = [];

                    mediaRecorder.addEventListener(
                        "stop",
                        () => {
                            recordedChunks = [];
                        },
                        {
                            once: true
                        }
                    );

                    mediaRecorder.stop();
                }

                stopRecordingUI();
            }

            async function finishAndSendRecording() {

                if (
                    !mediaRecorder ||
                    mediaRecorder.state ===
                        "inactive"
                ) {
                    return;
                }

                const finished =
                    new Promise(
                        resolve => {

                            mediaRecorder.addEventListener(
                                "stop",
                                resolve,
                                {
                                    once: true
                                }
                            );
                        }
                    );

                mediaRecorder.stop();

                stopRecordingUI();

                await finished;

                if (!recordedChunks.length) {
                    return;
                }

                const mimeType =
                    mediaRecorder.mimeType ||
                    "audio/webm";

                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type: mimeType
                        }
                    );

                recordedChunks = [];

                if (blob.size < 500) {

                    SChat.showToast(
                        "Recording was too short.",
                        "error"
                    );

                    return;
                }

                const extension =
                    mimeType.includes("mp4")
                        ? "m4a"
                        : mimeType.includes("ogg")
                            ? "ogg"
                            : "webm";

                const fd =
                    new FormData();

                fd.append(
                    "file",
                    blob,
                    `voice-note.${extension}`
                );

                try {

                    const result =
                        await SChat.apiUpload(
                            "/chat/attachment",
                            fd
                        );

                    const replyToMessageId =
                        replyingTo
                            ? replyingTo.id
                            : null;

                    const clientMessageId =
                        crypto.randomUUID
                            ? crypto.randomUUID()
                            : Date.now()
                                  .toString(36) +
                              "-" +
                              Math.random()
                                  .toString(36)
                                  .slice(2);

                    const sent =
                        SChatWS.send(
                            friendId,
                            "",
                            result.url,
                            replyToMessageId,
                            clientMessageId
                        );

                    if (sent) {

                        const replyToSnapshot =
                            replyingTo
                                ? {
                                    messageId:
                                        replyingTo.id,
                                    senderId:
                                        replyingTo.senderId,
                                    snippet:
                                        replyingTo.content,
                                    attachmentUrl:
                                        replyingTo.attachmentUrl ||
                                        null,
                                    deleted:
                                        false
                                }
                                : null;

                        const pendingRow =
                            renderMessage(
                                {
                                    content: "",
                                    attachmentUrl:
                                        result.url,
                                    sentAt:
                                        new Date().toISOString(),
                                    senderId:
                                        myUserId,
                                    replyTo:
                                        replyToSnapshot,
                                    reactions: []
                                },
                                true
                            );

                        pendingRows.set(
                            clientMessageId,
                            pendingRow
                        );

                        cancelReply();
                    }

                } catch (err) {

                    SChat.showToast(
                        err.message,
                        "error"
                    );
                }
            }

            document
                .getElementById(
                    "voice-note-btn"
                )
                .addEventListener(
                    "click",
                    startRecording
                );

            document
                .getElementById(
                    "voice-recording-cancel"
                )
                .addEventListener(
                    "click",
                    cancelRecording
                );

            document
                .getElementById(
                    "voice-recording-send"
                )
                .addEventListener(
                    "click",
                    finishAndSendRecording
                );

            loadHistory();
        });
    </script>
</body>
</html>
