<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — S-Chat</title>
    <link rel="stylesheet" href="css/S-Chat-Style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
</head>
<body>

    <div class="app-shell">
        <div class="titleandprofile">
            <img src="images/MY S.png" alt="" width="80" height="75" class="profilepicture" id="peer-avatar">
            <h1 class="h1-title" id="peer-name">Chat</h1>
        </div>

        <div id="chat-thread" class="chat-thread"></div>
    </div>

    <form id="chat-send-form" onsubmit="return false;">
        <div class="chat-message-box-container">
            <textarea name="chat-message-box" id="chat-message-box" class="chat-message-box"
                placeholder="Message..." required rows="1" spellcheck="true"></textarea>

            <button class="send-chat-btn" id="send-chat-btn" type="submit" aria-label="Send message">
                <img src="my icons/send-icon.png" alt="" height="22" width="22">
            </button>

            <div class="chat-file-sender-box">
                <label for="chat-file-sender" class="chat-files-sender-icon" aria-label="Attach file">
                    <img src="my icons/files-extention-icon.png" alt="" height="20" width="20">
                </label>
                <input type="file" name="chat-file-sender" id="chat-file-sender" class="chat-file-sender"
                    accept=".jpg,.jpeg,.png,.gif,.webp,.mp4,.mov">
            </div>
        </div>
    </form>

    <script src="js/nav.js" defer></script>
    <script src="js/friends.js" defer></script>
    <script src="js/ws-chat.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const isAI = params.get("ai") === "1";
            const friendId = params.get("friend");
            const friendName = params.get("name") || (isAI ? "Gemini" : "Chat");

            const peerName = document.getElementById("peer-name");
            const thread = document.getElementById("chat-thread");
            const chatForm = document.getElementById("chat-send-form");
            const textarea = document.getElementById("chat-message-box");
            const fileInput = document.getElementById("chat-file-sender");

            if (peerName) peerName.textContent = friendName;

            if (!isAI && !friendId) {
                if (thread) {
                    thread.innerHTML = '<p style="text-align:center;color:var(--s-text-dim);padding:24px;">Open a chat from your Chats list.</p>';
                }
                return;
            }

            function renderMessage(msg, mine) {
                if (!thread) return null;

                const bubble = document.createElement("div");
                bubble.className = "chat-bubble " + (mine ? "mine" : "theirs");

                if (msg.content) {
                    const text = document.createElement("span");
                    text.textContent = msg.content;
                    bubble.appendChild(text);
                }

                if (msg.attachmentUrl) {
                    const isVideo = /\.(mp4|mov|webm)$/i.test(msg.attachmentUrl);
                    const media = document.createElement(isVideo ? "video" : "img");
                    media.src = msg.attachmentUrl;
                    media.alt = isVideo ? "Video attachment" : "Image attachment";
                    if (isVideo) media.controls = true;
                    media.style.maxWidth = "100%";
                    media.style.borderRadius = "10px";
                    media.style.marginTop = msg.content ? "6px" : "0";
                    bubble.appendChild(media);
                }

                const meta = document.createElement("span");
                meta.className = "meta";
                meta.textContent = new Date(msg.sentAt || Date.now()).toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });
                bubble.appendChild(meta);

                thread.appendChild(bubble);
                thread.scrollTop = thread.scrollHeight;
                return bubble;
            }

            function addTypingBubble() {
                const bubble = renderMessage({ content: "Gemini is typing..." }, false);
                if (bubble) {
                    bubble.dataset.typing = "true";
                    bubble.style.opacity = "0.65";
                    bubble.style.fontStyle = "italic";
                }
                return bubble;
            }

            /* =====================================================
               REAL GEMINI MODE
               The browser sends conversation context to our own
               authenticated Spring Boot endpoint. The Gemini API key
               never reaches the browser.
               ===================================================== */
            if (isAI) {
                if (fileInput?.closest(".chat-file-sender-box")) {
                    fileInput.closest(".chat-file-sender-box").style.display = "none";
                }

                const user = SChat.Auth.getUser();
                const storageKey = "schat_ai_history_v1_" + (user?.publicId || "account");
                let aiHistory = [];

                try {
                    const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
                    if (Array.isArray(saved)) aiHistory = saved;
                } catch {
                    aiHistory = [];
                }

                // Keep only valid user/model turns and prevent old local history
                // from growing forever. The backend applies its own stricter limits.
                aiHistory = aiHistory
                    .filter((m) => m && (m.role === "user" || m.role === "model") && typeof m.content === "string")
                    .slice(-24);

                function saveHistory() {
                    try {
                        localStorage.setItem(storageKey, JSON.stringify(aiHistory.slice(-24)));
                    } catch {
                        // Storage can be unavailable in private/restricted browser modes.
                    }
                }

                if (!aiHistory.length) {
                    const greeting = "Hey! 👋 I'm Gemini, your S-Chat AI assistant. How can I help you today?";
                    aiHistory.push({ role: "model", content: greeting });
                    saveHistory();
                }

                aiHistory.forEach((message) => renderMessage(
                    { content: message.content },
                    message.role === "user"
                ));

                chatForm.addEventListener("submit", async (event) => {
                    event.preventDefault();

                    const content = textarea.value.trim();
                    if (!content) return;

                    textarea.value = "";
                    renderMessage({ content }, true);
                    aiHistory.push({ role: "user", content });
                    saveHistory();

                    const typing = addTypingBubble();
                    const sendButton = document.getElementById("send-chat-btn");
                    if (sendButton) sendButton.disabled = true;

                    try {
                        const result = await SChat.apiFetch("/ai/chat", {
                            method: "POST",
                            body: JSON.stringify({ messages: aiHistory.slice(-24) })
                        });

                        if (typing) typing.remove();

                        const reply = result?.text?.trim();
                        if (!reply) throw new Error("The AI assistant returned an empty response.");

                        renderMessage({ content: reply }, false);
                        aiHistory.push({ role: "model", content: reply });
                        saveHistory();
                    } catch (err) {
                        if (typing) typing.remove();
                        SChat.showToast(err.message || "The AI assistant is unavailable right now.", "error");
                    } finally {
                        if (sendButton) sendButton.disabled = false;
                        textarea.focus();
                    }
                });

                // Enter sends; Shift+Enter creates a new line.
                textarea.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" && !event.shiftKey) {
                        event.preventDefault();
                        chatForm.requestSubmit();
                    }
                });

                return;
            }

            /* =====================================================
               FRIEND CHAT MODE — real history + WebSocket
               ===================================================== */
            async function loadHistory() {
                try {
                    const messages = await SChat.apiFetch(`/chat/history/${friendId}?page=0&size=50`);
                    messages.slice().reverse().forEach((m) => {
                        renderMessage(m, m.senderId !== friendId);
                    });
                } catch (err) {
                    SChat.showToast(err.message, "error");
                }
            }

            if (typeof SChatWS !== "undefined") {
                SChatWS.connect();
                SChatWS.onMessage((data) => {
                    if (data.type === "chat" && data.senderId === friendId) {
                        renderMessage(data, false);
                    } else if (data.type === "error") {
                        SChat.showToast(data.message, "error");
                    }
                });
            }

            if (chatForm && textarea && fileInput && typeof SChatWS !== "undefined") {
                chatForm.addEventListener("submit", async (event) => {
                    event.preventDefault();

                    const content = textarea.value.trim();
                    let attachmentUrl = null;

                    if (fileInput.files.length) {
                        const fd = new FormData();
                        fd.append("file", fileInput.files[0]);
                        try {
                            const result = await SChat.apiUpload("/chat/attachment", fd);
                            attachmentUrl = result.url;
                        } catch (err) {
                            SChat.showToast(err.message, "error");
                            return;
                        }
                    }

                    if (!content && !attachmentUrl) return;

                    const sent = SChatWS.send(friendId, content, attachmentUrl);
                    if (sent) {
                        renderMessage({
                            content,
                            attachmentUrl,
                            sentAt: new Date().toISOString()
                        }, true);
                        textarea.value = "";
                        fileInput.value = "";
                    }
                });

                textarea.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" && !event.shiftKey) {
                        event.preventDefault();
                        chatForm.requestSubmit();
                    }
                });
            }

            loadHistory();
        });
    </script>
</body>
</html>
