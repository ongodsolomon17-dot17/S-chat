<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — S-Chat</title>
    <link rel="stylesheet" href="css/S-Chat-Style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
</head>

<body>
    <div class="app-shell">

        <div class="titleandprofile">
            <img src="images/MY S.png" alt="" width="80" height="75" class="profilepicture" id="peer-avatar">
            <h1 class="h1-title" id="peer-name">Chat</h1>
        </div>

        <div id="chat-thread" class="chat-thread"></div>

        <button
            type="button"
            class="chat-scroll-bottom"
            id="chat-scroll-bottom"
            aria-label="Jump to latest messages"
            title="Jump to latest messages"
        ><img src="my icons/scroll-to bottom-arrow.png" alt="↓" height="20" width="20"></button>

    </div>

    <!-- Reply preview shown above the composer while replying to a message -->
    <div class="composer-reply-preview" id="composer-reply-preview">
        <div class="reply-info">
            <div class="reply-label" id="reply-preview-label">Replying to</div>
            <div class="reply-text" id="reply-preview-text"></div>
        </div>

        <button
            type="button"
            class="composer-reply-cancel"
            id="reply-preview-cancel"
            aria-label="Cancel reply"
        >&times;</button>
    </div>

    <!-- Attachment tray: multiple files, previews and upload progress. -->
    <div class="file-preview-chip" id="file-preview-chip">
        <div id="file-preview-list" class="file-preview-list"></div>

        <button
            type="button"
            class="file-preview-remove"
            id="file-preview-remove"
            aria-label="Clear attachments"
        >&times;</button>
    </div>

    <!-- Voice-note recording indicator shown while recording is in progress -->
    <div class="voice-recording-chip" id="voice-recording-chip">
        <span class="voice-recording-dot"></span>
        <span class="voice-recording-time" id="voice-recording-time">0:00</span>
        <span class="voice-recording-label">Recording voice note…</span>

        <button
            type="button"
            class="voice-recording-cancel"
            id="voice-recording-cancel"
            aria-label="Cancel recording"
        >&times;</button>

        <button
            type="button"
            class="voice-recording-send"
            id="voice-recording-send"
            aria-label="Send voice note"
        >&#10148;</button>
    </div>

    <form id="chat-send-form" onsubmit="return false;">
        <div class="chat-message-box-container">

            <textarea
                name="chat-message-box"
                id="chat-message-box"
                class="chat-message-box"
                placeholder="Message..."
                rows="1"
                spellcheck="true"
            ></textarea>

            <button
                class="send-chat-btn"
                id="send-chat-btn"
                type="submit"
                aria-label="Send message"
                hidden
            >
                <img src="my icons/send-icon.png" alt="" height="22" width="22">
            </button>

            <button
                class="voice-note-btn"
                id="voice-note-btn"
                type="button"
                aria-label="Record voice note"
            >
                🎙️
            </button>

            <div class="chat-file-sender-box">
                <label
                    for="chat-file-sender"
                    class="chat-files-sender-icon"
                    aria-label="Attach file"
                >
                    <img
                        src="my icons/files-extention-icon.png"
                        alt=""
                        height="20"
                        width="20"
                    >
                </label>

                <input
                    type="file"
                    name="chat-file-sender"
                    id="chat-file-sender"
                    class="chat-file-sender"
                    accept="image/*,video/*,audio/*,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip"
                    multiple
                >
            </div>

        </div>
    </form>

    <!-- Fullscreen media viewer for tapped images/videos -->
    <div class="media-lightbox" id="media-lightbox">
        <button
            class="close-btn"
            id="media-lightbox-close"
            aria-label="Close"
        >&times;</button>

        <div id="media-lightbox-content"></div>
    </div>

    <!-- Reply / React / Delete menu -->
    <div class="message-actions" id="message-actions"></div>

    <!-- Emoji reaction picker -->
    <div class="reaction-picker" id="reaction-picker"></div>

    <!-- Full emoji picker -->
    <div class="full-emoji-overlay" id="full-emoji-overlay">
        <div class="full-emoji-panel">

            <div class="full-emoji-header">
                <input
                    type="text"
                    id="full-emoji-search"
                    placeholder="Search categories (e.g. food, animals)…"
                >

                <button
                    type="button"
                    id="full-emoji-close"
                    aria-label="Close"
                >&times;</button>
            </div>

            <div
                class="full-emoji-grid"
                id="full-emoji-grid"
            ></div>

        </div>
    </div>

    <script src="js/nav.js" defer></script>
    <script src="js/friends.js" defer></script>
    <script src="js/ws-chat.js" defer></script>
    <script src="js/notifications.js" defer></script>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {

            const params = new URLSearchParams(window.location.search);
            const isAI = params.get("ai") === "1";
            const friendId = params.get("friend");
            const friendName =
                params.get("name") ||
                (isAI ? "Gemini" : "Chat");

            const peerName = document.getElementById("peer-name");

            if (peerName) {
                peerName.textContent = friendName;
            }

            const thread = document.getElementById("chat-thread");
            const scrollBottomBtn =
                document.getElementById("chat-scroll-bottom");

            function isNearChatBottom() {
                if (!thread) return true;

                return (
                    thread.scrollHeight -
                    thread.scrollTop -
                    thread.clientHeight
                ) < 96;
            }

            function scrollChatToBottom(smooth = true) {
                if (!thread) return;

                thread.scrollTo({
                    top: thread.scrollHeight,
                    behavior: smooth ? "smooth" : "auto"
                });

                updateChatBottomButton();
            }

            function updateChatBottomButton() {
                if (!scrollBottomBtn || !thread) return;

                const awayFromBottom =
                    thread.scrollHeight -
                    thread.scrollTop -
                    thread.clientHeight > 120;

                scrollBottomBtn.classList.toggle(
                    "show",
                    awayFromBottom
                );
            }

            thread?.addEventListener(
                "scroll",
                updateChatBottomButton,
                { passive: true }
            );

            scrollBottomBtn?.addEventListener(
                "click",
                () => scrollChatToBottom(true)
            );

            let myUserId = null;

            try {
                const me = await SChat.apiFetch("/users/me");
                myUserId = me.id || null;
            } catch {
                /*
                 * stays null; renderMessage still works using
                 * the mine/theirs flag passed in
                 */
            }

            if (!isAI && !friendId) {

                if (thread) {
                    thread.innerHTML =
                        '<p style="text-align:center;color:var(--s-text-dim);padding:24px;">Open a chat from your Chats list.</p>';
                }

                const composer =
                    document.getElementById("chat-send-form");

                if (composer) {
                    composer.style.display = "none";
                }

                return;
            }

            const REACTION_SET = [
                "❤️",
                "😂",
                "👍",
                "😮",
                "😢",
                "🙏"
            ];

            const isVideoUrl = (url) =>
                /\.(mp4|mov)$/i.test(url || "");

            const isAudioUrl = (url) =>
                /\.(webm|ogg|m4a|mp3|aac)$/i.test(url || "");

            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent =
                    str == null ? "" : String(str);
                return div.innerHTML;
            }

            /* =====================================================
               MEDIA LIGHTBOX
               ===================================================== */

            const lightbox =
                document.getElementById("media-lightbox");

            const lightboxContent =
                document.getElementById(
                    "media-lightbox-content"
                );

            function openLightbox(url, video) {

                lightboxContent.innerHTML = video
                    ? `<video src="${escapeHtml(url)}" controls autoplay></video>`
                    : `<img src="${escapeHtml(url)}" alt="">`;

                lightbox.classList.add("show");
            }

            function closeLightbox() {

                lightbox.classList.remove("show");
                lightboxContent.innerHTML = "";
            }

            document
                .getElementById("media-lightbox-close")
                .addEventListener(
                    "click",
                    closeLightbox
                );

            lightbox.addEventListener("click", (e) => {

                if (e.target === lightbox) {
                    closeLightbox();
                }

            });

            /* =====================================================
               MESSAGE RENDERING
               ===================================================== */

            function renderReplyQuote(replyTo) {

                if (!replyTo) return "";

                if (
                    replyTo.deleted ||
                    (!replyTo.snippet &&
                        !replyTo.attachmentUrl)
                ) {
                    return `
                        <div class="reply-quote deleted">
                            <span class="reply-snippet">
                                Original message unavailable
                            </span>
                        </div>
                    `;
                }

                const who =
                    replyTo.senderId === myUserId
                        ? "You"
                        : escapeHtml(friendName);

                const snippetText =
                    replyTo.snippet ||
                    attachmentLabel(
                        replyTo.attachmentUrl
                    );

                return `
                    <div class="reply-quote">
                        <span class="reply-sender">
                            ${who}
                        </span>

                        <span class="reply-snippet">
                            ${escapeHtml(snippetText)}
                        </span>
                    </div>
                `;
            }

            function attachmentLabel(url) {

                if (isAudioUrl(url)) {
                    return "🎤 Voice message";
                }

                if (isVideoUrl(url)) {
                    return "🎥 Video";
                }

                return "📷 Photo";
            }

            /* =====================================================
               READ RECEIPTS
               ===================================================== */

            function renderTicks(msg) {

                if (msg.readAt) {
                    return '<span class="ticks read" title="Read">✓✓</span>';
                }

                if (msg.deliveredAt) {
                    return '<span class="ticks delivered" title="Delivered">✓✓</span>';
                }

                return '<span class="ticks sent" title="Sent">✓</span>';
            }

            function markRowRead(row) {

                const ticksEl =
                    row.querySelector(".ticks");

                if (!ticksEl) return;

                ticksEl.outerHTML =
                    '<span class="ticks read" title="Read">✓✓</span>';
            }

            function renderReactionBar(reactions) {

                if (!reactions || !reactions.length) {
                    return "";
                }

                return `
                    <div class="reaction-bar">
                        ${reactions.map((r) => `
                            <span
                                class="reaction-pill${r.reactedByMe ? " mine" : ""}"
                                data-reaction="${escapeHtml(r.reactionType)}"
                            >
                                ${escapeHtml(r.reactionType)}
                                ${r.count}
                            </span>
                        `).join("")}
                    </div>
                `;
            }

            function renderMessage(msg, mine) {

                if (!thread) return;

                const row =
                    document.createElement("div");

                row.className =
                    "chat-bubble-row " +
                    (mine ? "mine" : "theirs");

                if (msg.id) {
                    row.dataset.messageId = msg.id;
                }

                row.dataset.senderId =
                    mine
                        ? (myUserId || "")
                        : friendId;

                const bubble =
                    document.createElement("div");

                const hasMedia =
                    !!msg.attachmentUrl;

                bubble.className =
                    "chat-bubble " +
                    (mine ? "mine" : "theirs") +
                    (hasMedia ? " has-media" : "") +
                    (msg.deleted
                        ? " deleted-message"
                        : "");

                let html = "";

                html += renderReplyQuote(msg.replyTo);

                if (
                    hasMedia &&
                    !msg.deleted
                ) {

                    if (
                        isAudioUrl(
                            msg.attachmentUrl
                        )
                    ) {

                        html += `
                            <div class="attachment-audio">
                                <audio
                                    src="${escapeHtml(msg.attachmentUrl)}"
                                    controls
                                    preload="metadata"
                                ></audio>
                            </div>
                        `;

                    } else if (
                        isVideoUrl(
                            msg.attachmentUrl
                        )
                    ) {

                        html += `
                            <div
                                class="attachment-media is-video"
                                data-url="${escapeHtml(msg.attachmentUrl)}"
                                data-video="true"
                            >
                                <video
                                    src="${escapeHtml(msg.attachmentUrl)}"
                                    controls
                                    playsinline
                                    preload="metadata"
                                ></video>
                            </div>
                        `;

                    } else if (
                        /\.(jpg|jpeg|png|gif|webp)(?:$|[?#])/i
                            .test(msg.attachmentUrl)
                    ) {

                        html += `
                            <div
                                class="attachment-media"
                                data-url="${escapeHtml(msg.attachmentUrl)}"
                                data-video="false"
                            >
                                <img
                                    src="${escapeHtml(msg.attachmentUrl)}"
                                    alt=""
                                    loading="lazy"
                                >
                                <span class="expand-hint">
                                    Tap to view
                                </span>
                            </div>
                        `;

                    } else {

                        const name =
                            decodeURIComponent(
                                (
                                    msg.attachmentUrl ||
                                    ""
                                )
                                .split("/")
                                .pop()
                                .split("?")[0]
                            ) || "Attachment";

                        html += `
                            <a
                                class="attachment-file-card"
                                href="${escapeHtml(msg.attachmentUrl)}"
                                target="_blank"
                                rel="noopener"
                                download
                            >
                                <span class="attachment-file-icon">
                                    📎
                                </span>

                                <span class="attachment-file-info">
                                    <strong>
                                        ${escapeHtml(name)}
                                    </strong>

                                    <small>
                                        Open / download file
                                    </small>
                                </span>
                            </a>
                        `;
                    }
                }

                const textContent =
                    msg.deleted
                        ? "This message was deleted"
                        : (msg.content || "");

                if (textContent) {

                    html += `
                        <span class="bubble-text">
                            ${escapeHtml(textContent)}
                        </span>
                    `;
                }

                const time =
                    new Date(
                        msg.sentAt || Date.now()
                    ).toLocaleTimeString(
                        [],
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

                const ticksHtml =
                    mine &&
                    !msg.deleted &&
                    msg.id
                        ? renderTicks(msg)
                        : "";

                html += `
                    <span class="meta">
                        ${time}${ticksHtml}
                    </span>
                `;

                bubble.innerHTML = html;

                if (
                    hasMedia &&
                    !msg.deleted
                ) {

                    const mediaEl =
                        bubble.querySelector(
                            ".attachment-media"
                        );

                    if (
                        mediaEl &&
                        mediaEl.dataset.video !== "true"
                    ) {

                        mediaEl.addEventListener(
                            "click",
                            () =>
                                openLightbox(
                                    mediaEl.dataset.url,
                                    false
                                )
                        );
                    }
                }

                const bubbleLine =
                    document.createElement("div");

                bubbleLine.className =
                    "bubble-line";

                row.appendChild(bubbleLine);
                bubbleLine.appendChild(bubble);

                if (!msg.deleted) {

                    const reactionBar =
                        document.createElement("div");

                    reactionBar.innerHTML =
                        renderReactionBar(
                            msg.reactions
                        );

                    if (reactionBar.firstChild) {

                        row.appendChild(
                            reactionBar.firstChild
                        );

                        row
                            .querySelectorAll(
                                ".reaction-pill"
                            )
                            .forEach((pill) => {

                                pill.addEventListener(
                                    "click",
                                    () =>
                                        toggleReaction(
                                            row,
                                            pill.dataset.reaction
                                        )
                                );

                            });
                    }

                    const trigger =
                        document.createElement("button");

                    trigger.type = "button";

                    trigger.className =
                        "hover-actions-trigger";

                    trigger.setAttribute(
                        "aria-label",
                        "Message actions"
                    );

                    trigger.textContent = "⋯";

                    trigger.addEventListener(
                        "click",
                        (e) =>
                            openMessageActions(
                                e,
                                row,
                                msg,
                                mine
                            )
                    );

                    if (mine) {
                        bubbleLine.insertBefore(
                            trigger,
                            bubble
                        );
                    } else {
                        bubbleLine.appendChild(
                            trigger
                        );
                    }

                    if (msg.id) {

                        const swipeIcon =
                            document.createElement("span");

                        swipeIcon.className =
                            "swipe-reply-icon";

                        swipeIcon.textContent =
                            "↩️";

                        row.insertBefore(
                            swipeIcon,
                            row.firstChild
                        );
                    }

                    attachSwipeToReply(
                        row,
                        bubble,
                        msg
                    );

                    bubble.addEventListener(
                        "contextmenu",
                        (e) => {

                            if (!msg.id) return;

                            e.preventDefault();
                            e.stopPropagation();

                            openMessageActions(
                                e,
                                row,
                                msg,
                                mine
                            );
                        }
                    );

                    let longPressTimer = null;
                    let longPressTriggered = false;
                    let longPressStartX = 0;
                    let longPressStartY = 0;

                    bubble.addEventListener(
                        "pointerdown",
                        (e) => {

                            if (
                                e.pointerType === "mouse" ||
                                !msg.id
                            ) {
                                return;
                            }

                            longPressTriggered = false;

                            longPressStartX =
                                e.clientX;

                            longPressStartY =
                                e.clientY;

                            longPressTimer =
                                setTimeout(() => {

                                    longPressTriggered =
                                        true;

                                    openMessageActions(
                                        {
                                            stopPropagation() {},
                                            currentTarget:
                                                bubble
                                        },
                                        row,
                                        msg,
                                        mine
                                    );

                                }, 550);
                        }
                    );

                    bubble.addEventListener(
                        "pointermove",
                        (e) => {

                            if (
                                e.pointerType !== "mouse" &&
                                longPressTimer &&
                                (
                                    Math.abs(
                                        e.clientX -
                                        longPressStartX
                                    ) > 8 ||
                                    Math.abs(
                                        e.clientY -
                                        longPressStartY
                                    ) > 8
                                )
                            ) {

                                clearTimeout(
                                    longPressTimer
                                );

                                longPressTimer = null;
                            }
                        }
                    );

                    [
                        "pointerup",
                        "pointercancel",
                        "pointerleave"
                    ].forEach(
                        (type) =>
                            bubble.addEventListener(
                                type,
                                (e) => {

                                    if (longPressTimer) {
                                        clearTimeout(
                                            longPressTimer
                                        );
                                    }

                                    longPressTimer = null;

                                    if (
                                        longPressTriggered &&
                                        e.cancelable
                                    ) {
                                        e.preventDefault();
                                    }
                                }
                            )
                    );
                }

                const shouldStickToBottom =
                    isNearChatBottom();

                thread.appendChild(row);

                if (shouldStickToBottom) {
                    scrollChatToBottom(false);
                }

                updateChatBottomButton();

                return row;
            }

            /* =====================================================
               SWIPE-TO-REPLY
               ===================================================== */

            function attachSwipeToReply(
                row,
                bubble,
                msg
            ) {

                if (!msg.id) return;

                const THRESHOLD = 56;

                let dragging = false;
                let startX = 0;
                let dx = 0;

                bubble.addEventListener(
                    "pointerdown",
                    (e) => {

                        if (e.pointerType === "mouse") {
                            return;
                        }

                        dragging = true;
                        startX = e.clientX;

                        bubble.setPointerCapture(
                            e.pointerId
                        );
                    }
                );

                bubble.addEventListener(
                    "pointermove",
                    (e) => {

                        if (!dragging) return;

                        dx = e.clientX - startX;

                        const clamped =
                            Math.max(
                                -THRESHOLD - 20,
                                Math.min(
                                    THRESHOLD + 20,
                                    dx
                                )
                            );

                        bubble.style.transform =
                            `translateX(${clamped}px)`;

                        row.classList.toggle(
                            "swiping",
                            Math.abs(clamped) > 12
                        );
                    }
                );

                function endSwipe() {

                    if (!dragging) return;

                    dragging = false;

                    bubble.style.transform = "";

                    row.classList.remove(
                        "swiping"
                    );

                    if (
                        Math.abs(dx) >
                        THRESHOLD
                    ) {
                        startReply(msg);
                    }

                    dx = 0;
                }

                bubble.addEventListener(
                    "pointerup",
                    endSwipe
                );

                bubble.addEventListener(
                    "pointercancel",
                    endSwipe
                );
            }

            /* =====================================================
               REPLY COMPOSER STATE
               ===================================================== */

            let replyingTo = null;

            const replyPreviewBox =
                document.getElementById(
                    "composer-reply-preview"
                );

            const replyPreviewText =
                document.getElementById(
                    "reply-preview-text"
                );

            const replyPreviewLabel =
                document.getElementById(
                    "reply-preview-label"
                );

            function startReply(msg) {

                if (msg.deleted) return;

                replyingTo = msg;

                replyPreviewLabel.textContent =
                    "Replying to " +
                    (
                        msg.senderId === myUserId
                            ? "yourself"
                            : friendName
                    );

                replyPreviewText.textContent =
                    msg.content ||
                    (
                        msg.attachmentUrl
                            ? attachmentLabel(
                                msg.attachmentUrl
                            )
                            : ""
                    );

                replyPreviewBox.classList.add(
                    "show"
                );

                const textarea =
                    document.getElementById(
                        "chat-message-box"
                    );

                if (textarea) {
                    textarea.focus();
                }
            }

            function cancelReply() {

                replyingTo = null;

                replyPreviewBox.classList.remove(
                    "show"
                );
            }

            document
                .getElementById(
                    "reply-preview-cancel"
                )
                .addEventListener(
                    "click",
                    cancelReply
                );

            /* =====================================================
               MESSAGE ACTIONS MENU
               ===================================================== */

            const actionsMenu =
                document.getElementById(
                    "message-actions"
                );

            const reactionPicker =
                document.getElementById(
                    "reaction-picker"
                );

            function closeMenus() {

                actionsMenu.classList.remove(
                    "show"
                );

                reactionPicker.classList.remove(
                    "show"
                );
            }

            document.addEventListener(
                "click",
                (e) => {

                    if (
                        !actionsMenu.contains(e.target) &&
                        !reactionPicker.contains(e.target) &&
                        !e.target.closest(
                            ".hover-actions-trigger"
                        )
                    ) {
                        closeMenus();
                    }
                }
            );

            function positionNear(el, target) {

                const rect =
                    target.getBoundingClientRect();

                el.style.left =
                    Math.min(
                        rect.left,
                        window.innerWidth - 180
                    ) + "px";

                el.style.top =
                    (
                        rect.top -
                        8 +
                        window.scrollY -
                        el.offsetHeight
                    ) + "px";
            }

            function openMessageActions(
                e,
                row,
                msg,
                mine
            ) {

                e.stopPropagation();

                if (!msg.id) return;

                actionsMenu.innerHTML = "";

                if (!msg.deleted) {

                    const replyBtn =
                        document.createElement("button");

                    replyBtn.textContent =
                        "↩️ Reply";

                    replyBtn.addEventListener(
                        "click",
                        () => {

                            startReply(msg);
                            closeMenus();

                        }
                    );

                    actionsMenu.appendChild(
                        replyBtn
                    );

                    const reactBtn =
                        document.createElement("button");

                    reactBtn.textContent =
                        "🙂 React";

                    reactBtn.addEventListener(
                        "click",
                        () => {

                            closeMenus();

                            openReactionPicker(
                                e,
                                row,
                                msg
                            );

                        }
                    );

                    actionsMenu.appendChild(
                        reactBtn
                    );

                    const hideBtn =
                        document.createElement("button");

                    hideBtn.textContent =
                        "🙈 Delete for me";

                    hideBtn.addEventListener(
                        "click",
                        () => {

                            hideForMe(
                                row,
                                msg
                            );

                            closeMenus();

                        }
                    );

                    actionsMenu.appendChild(
                        hideBtn
                    );

                    if (mine) {

                        const delBtn =
                            document.createElement(
                                "button"
                            );

                        delBtn.className =
                            "danger";

                        delBtn.textContent =
                            "🗑️ Delete for everyone";

                        delBtn.addEventListener(
                            "click",
                            () => {

                                deleteForEveryone(

            function renderEmojiGrid(
                grid,
                query
            ) {

                grid.innerHTML = "";

                const q =
                    query
                        .trim()
                        .toLowerCase();

                Object.entries(
                    EMOJI_CATEGORIES
                ).forEach(
                    ([category, emojis]) => {

                            q &&

                                .includes(q)

                            document.createElement(

            /* =====================================================
               REACTIONS
               ===================================================== */

            async function toggleReaction(
                row,
                reactionType
            ) {

                const messageId =
                    row.dataset.messageId;

                if (!messageId) return;

                const existingMine =
                    row.querySelector(
                        `.reaction-pill.mine[data-reaction="${CSS.escape(reactionType)}"]`
                    );

                try {

                    const updated =
                        existingMine
                            ? await SChat.apiFetch(
                                `/chat/messages/${messageId}/reactions`,
                                {
                                    method: "DELETE"
                                }
                            )
                            : await SChat.apiFetch(
                                `/chat/messages/${messageId}/reactions`,
                                {
                                    method: "POST",
                                    body:
                                        JSON.stringify({
                                            reactionType
                                        })
                                }
                            );

                    applyReactionUpdate(
                        row,
                        updated.reactions
                    );

                } catch (err) {

                    SChat.showToast(
                        err.message,
                        "error"
                    );
                }
            }

            function applyReactionUpdate(
                row,
                reactions
            ) {

                let bar =
                    row.querySelector(
                        ".reaction-bar"
                    );

                const html =
                    renderReactionBar(
                        reactions
                    );

                if (!html) {

                    if (bar) {
                        bar.remove();
                    }

                    return;
                }

                const temp =
                    document.createElement(
                        "div"
                    );

                temp.innerHTML = html;

                const newBar =
                    temp.firstElementChild;

                newBar
                    .querySelectorAll(
                        ".reaction-pill"
                    )
                    .forEach(
                        (pill) => {

                            pill.addEventListener(
                                "click",
                                () =>
                                    toggleReaction(
                                        row,
                                        pill.dataset.reaction
                                    )
                            );
                        }
                    );

                if (bar) {
                    row.replaceChild(
                        newBar,
                        bar
                    );
                } else {
                    row.appendChild(
                        newBar
                    );
                }
            }

            /* =====================================================
               DELETE FOR EVERYONE
               ===================================================== */

            async function deleteForEveryone(
                row,
                msg
            ) {

                if (
                    !confirm(
                        "Delete this message for everyone?"
                    )
                ) {
                    return;
                }

                try {

                    await SChat.apiFetch(
                        `/chat/messages/${msg.id}`,
                        {
                            method: "DELETE"
                        }
                    );

                    msg.deleted = true;
                    msg.content =
                        "This message was deleted";
                    msg.attachmentUrl = null;

                    const bubble =
                        row.querySelector(
                            ".chat-bubble"
                        );

                    const existingMeta =
                        bubble.querySelector(
                            ".meta"
                        );

                    bubble.className =
                        "chat-bubble " +
                        (
                            msg.senderId === myUserId
                                ? "mine"
                                : "theirs"
                        ) +
                        " deleted-message";

                    bubble.innerHTML = `
                        <span class="bubble-text">
                            This message was deleted
                        </span>
                    `;

                    if (existingMeta) {
                        bubble.appendChild(
                            existingMeta
                        );
                    }

                    const bar =
                        row.querySelector(
                            ".reaction-bar"
                        );

                    if (bar) {
                        bar.remove();
                    }

                } catch (err) {

                    SChat.showToast(
                        err.message,
                        "error"
                    );
                }
            }
