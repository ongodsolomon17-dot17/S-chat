server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: s-chat-backend

  datasource:
    # Supabase connection pooler URL, e.g.
    # jdbc:postgresql://aws-0-region.pooler.supabase.com:6543/postgres
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      data-source-properties:
        prepareThreshold: 0

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:https://s-chat-zeta.vercel.app}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-address: ${RESEND_FROM_ADDRESS:S-Chat <no-reply@yourdomain.com>}
  supabase:
    url: ${SUPABASE_URL}
    service-key: ${SUPABASE_SERVICE_KEY}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:s-chat-media}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.stech.schat: INFO
    org.springframework.security: WARN