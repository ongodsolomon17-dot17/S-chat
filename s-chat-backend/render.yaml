services:
  - type: web
    name: s-chat-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard — never commit this
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false        # e.g. https://s-chat.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: s-chat-media
      - key: JPA_DDL_AUTO
        value: update
      - key: GEMINI_API_KEY
        sync: false        # set manually in Render dashboard — never commit this
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_CREDENTIAL_TTL_SECONDS
        value: "3600"
