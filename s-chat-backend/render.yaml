services:
  - type: web
    name: s-chat-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # --- Primary database: Supabase (secrets: set in the Render dashboard) ---
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_DIRECT_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      # --- Fallback database: Neon (leave NEON_DB_URL empty to disable failover) ---
      - key: NEON_DB_URL
        sync: false
      - key: NEON_DB_USER
        sync: false
      - key: NEON_DB_PASSWORD
        sync: false
      - key: DB_FALLBACK_READ_ONLY
        value: "true"
      - key: JPA_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TERMS_VERSION
        value: "2026-11-19"
      - key: PRIVACY_VERSION
        value: "2026-11-19"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: s-chat-media
      - key: APP_NAME
        value: S-Chat
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_CREDENTIAL_TTL_SECONDS
        value: "3600"
