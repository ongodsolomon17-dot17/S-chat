services:
  - type: web
    name: s-chat-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard — never commit this
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false        # e.g. https://s-chat.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: JPA_DDL_AUTO
        value: update
